<title>Festigung — Daten und Zufall</title>

     damit nichts von Google live geholt wird?»): Hier standen drei
     Zeilen, die Fira Sans, Source Sans und Patrick Hand von
     fonts.googleapis.com holten.

     Sie waren das EINZIGE Externe an einer sonst selbsttragenden Seite -
     und sie hielten sie an: Ein <link rel=stylesheet> im <head> blockiert
     die Ausfuehrung aller nachfolgenden Skripte, bis er geladen ist.
     Haengt Google, laeuft das Flaechenskript nie an: Seite halb da,
     Schrift falsch, Karten unbeweglich. Genau dieses Bild am 2026-08-22.

     Dazu ging bei jedem Aufruf einer Schulklasse eine IP an einen
     Dritten. Siehe bauen/schriften/HERKUNFT.md. -->
<style>
@font-face{font-family:'Fira Sans';font-style:normal;font-weight:400;src:url('schriften/FiraSans-Regular.woff') format('woff')}
@font-face{font-family:'Fira Sans';font-style:italic;font-weight:400;src:url('schriften/FiraSans-Italic.woff') format('woff')}
@font-face{font-family:'Fira Sans';font-style:normal;font-weight:600;src:url('schriften/FiraSans-SemiBold.woff') format('woff')}
@font-face{font-family:'Fira Sans';font-style:normal;font-weight:700;src:url('schriften/FiraSans-Bold.woff') format('woff')}
@font-face{font-family:'Patrick Hand';font-style:normal;font-weight:400;src:url('schriften/PatrickHand-Regular.woff') format('woff')}

<style>
:root{ --papier:#f8f4ec; --creme:#f6ecdf; --karte:#fffefb;
       --tinte:#2d2924; --matt:#6c6357; --linie:#e4d9c7;
       --blase:#efe2cd;
       --druck:'Fira Sans','Segoe UI',-apple-system,sans-serif;
       --hand:'Patrick Hand',cursive;
       --akzent:#9867A5; --akzentblass:#9867A514; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.6 var(--druck);color:var(--tinte);
     background:var(--papier);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:9px 18px;
       border-bottom:1px solid var(--linie);background:var(--karte);flex:0 0 auto}
header .streifen{width:5px;height:26px;background:var(--akzent);border-radius:3px;
                 transition:background .2s}
header h1{font-family:var(--hand);font-size:21px;margin:0;font-weight:400}
header .zart{color:var(--matt);font-size:13px;margin-left:auto}

.buehne{flex:1 1 auto;display:flex;gap:0;min-height:0}

/* ---- die Landkarte, immer sichtbar ---- */
.karte-links{flex:0 0 auto;width:330px;overflow:auto;padding:12px 10px 16px 14px;
             border-right:1px solid var(--linie);background:var(--creme)}
.karte-links h2{font-family:var(--hand);font-size:18px;font-weight:400;
                margin:0 0 3px;color:var(--matt)}
.karte-links .hinweis{font-size:12px;color:var(--matt);margin:0 0 10px}
table.matrix{border-collapse:separate;border-spacing:3px;width:100%}
table.matrix th{font-size:10.5px;font-weight:600;color:var(--matt);
                padding:0 0 3px;text-align:center;line-height:1.25}
table.matrix th.welt{text-align:left;padding-right:5px;font-size:11.5px}
table.matrix td{padding:0}
.zelle{display:block;width:100%;height:30px;border-radius:7px;border:1.5px solid;
       background:var(--karte);cursor:pointer;font:inherit;font-size:11px;
       color:var(--matt);transition:transform .1s}
.zelle:hover{transform:scale(1.06)}
.zelle[aria-current=true]{color:#fff;font-weight:600}
.weltbild{width:26px;height:26px;border-radius:5px;object-fit:cover;
          vertical-align:middle;margin-right:5px;border:1px solid var(--linie)}

/* ---- die Aufgabe ---- */
.aufgabe{flex:1 1 auto;overflow:auto;padding:16px 22px 40px}
.kopfzeile{display:flex;gap:16px;align-items:flex-start;
           background:var(--karte);border:1px solid var(--linie);
           border-radius:12px;padding:14px 16px;margin-bottom:16px}
.kopfzeile img{width:112px;border-radius:9px;flex:0 0 auto}
.kopfzeile .welt{font-family:var(--hand);font-size:24px;margin:0 0 2px}
.kopfzeile .kurz{color:var(--matt);font-size:13px;margin:0 0 8px}
.kopfzeile .kontext{font-size:14.5px}
.kopfzeile .kontext ul{margin:6px 0 0;padding-left:20px}
.kopfzeile .kontext li{margin:2px 0}

.schwerpunkt{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.schwerpunkt .nr{background:var(--akzent);color:#fff;border-radius:6px;
                 padding:2px 10px;font-size:13px;font-weight:600}
.schwerpunkt h3{font-family:var(--hand);font-size:22px;font-weight:400;margin:0;
                color:var(--akzent)}

ol.auftraege{margin:0;padding-left:26px}
ol.auftraege li{margin:0 0 12px;padding-left:3px}
ol.auftraege li::marker{color:var(--akzent);font-weight:600}

.loesung{margin-top:18px}
.loesung button{font:inherit;font-size:13.5px;padding:7px 14px;border-radius:8px;
   border:1px solid var(--linie);background:var(--karte);color:var(--tinte);
   cursor:pointer}
.loesung button:hover{border-color:var(--akzent);color:var(--akzent)}
/* Die Loesung ist ein TEXT, keine Liste - aber ein gegliederter.
   Absaetze trennen die Teilaufgaben, Umbrueche zaehlen innerhalb einer
   auf. Beides steht so im Skript und geht sonst verloren. */
/* Der Binomialkoeffizient - gestapelt, in Klammern. Ohne den Strich,
   der ihn sonst zum Bruch machen wuerde. */
.binom{display:inline-flex;flex-direction:column;vertical-align:middle;
   text-align:center;line-height:1.04;margin:0 .1em;padding:0 .28em;
   position:relative}
.binom::before,.binom::after{position:absolute;top:-.12em;bottom:-.12em;
   width:.3em;content:'';border:1.2px solid currentColor}
.binom::before{left:0;border-right:none;border-radius:.35em 0 0 .35em}
.binom::after{right:0;border-left:none;border-radius:0 .35em .35em 0}
.binom i{font-style:normal;padding:0 .1em}
.formel .wort{font-family:var(--druck);font-style:normal;padding:0 .15em}
.loesung .inhalt p{margin:0 0 9px}
.loesung .inhalt p:last-child{margin-bottom:0}
.loesung .inhalt p b:first-child{color:var(--akzent)}
.loesung .inhalt{display:none;margin-top:10px;background:var(--blase);
   border-left:4px solid var(--akzent);border-radius:7px;padding:11px 14px;
   font-size:14px}
.loesung.offen .inhalt{display:block}
.loesung .fehlt{color:var(--matt);font-style:italic}

.weiter{display:flex;gap:10px;margin-top:26px;padding-top:16px;
        border-top:1px solid var(--linie);flex-wrap:wrap}
.weiter button{font:inherit;font-size:13.5px;padding:8px 15px;border-radius:8px;
   border:1px solid var(--linie);background:var(--karte);cursor:pointer;
   text-align:left;line-height:1.35}
.weiter button:hover{border-color:var(--akzent)}
.weiter button b{display:block;font-weight:600;font-size:12px;color:var(--matt)}
/* Der Fehlerkasten traegt eine ABSICHTLICH falsche Rechnung. Er muss
   sich vom Auftragstext absetzen, sonst liest man ihn als Anleitung.

   NEU (2026-08-21, Rikes Rueckmeldung): nicht mehr rot, sondern in der
   Farbe des Kapitels, in dem man gerade steht - Kapitel 1 lila, 2 gruen,
   3 ocker, 4 blau. Rot war ein zweites Farbsystem auf derselben Seite
   und behauptete «Fehler» als eigene Kategorie. Der Kasten sagt mit
   seinem Text, was er ist; die Farbe soll sagen, WO man ist.
   Das ist dieselbe Regel wie in agent/05_layout.md, Abschnitt 8. */
.fehlerkasten{margin:8px 0 4px;padding:9px 13px;border-radius:8px;
   background:var(--akzentblass);border-left:4px solid var(--akzent);
   font-style:italic;font-size:14px;color:var(--tinte)}
.knacknuss{display:inline-block;background:var(--akzent);color:#fff;
   border-radius:5px;padding:1px 8px;font-size:11px;font-weight:600;
   margin-right:5px;font-style:normal}
.entwurf{background:#FFF8E1;border-bottom:1px solid #E6C15A;padding:5px 18px;
         font-size:12px;flex:0 0 auto}
b{font-weight:600}
/* ───────── Die Notizleiste (auf allen Seiten gleich) ─────────
   Sie steht unten und ist zugeklappt eine Zeile hoch. Aufgeklappt
   nimmt sie hoechstens die halbe Seite - man soll noch sehen, worueber
   man schreibt. */
.notizleiste{position:fixed;left:0;right:0;bottom:0;z-index:100001;
   background:var(--karte);border-top:2px solid var(--akzent);
   box-shadow:0 -3px 14px rgba(45,41,36,.13);font:14px var(--druck)}
.notizgriff{display:block;width:100%;text-align:left;border:none;
   background:none;font:inherit;font-size:13.5px;color:var(--tinte);
   padding:7px 18px;cursor:pointer}
.notizgriff:hover{background:var(--creme)}
.notizgriff .stift{color:var(--akzent);font-size:15px;margin-right:5px}
.notizgriff .zart{color:var(--matt)}
.notizinhalt{display:none;padding:0 18px 12px;max-height:46vh;overflow:auto}
.notizleiste.offen .notizinhalt{display:block}
.notizwo{font-size:12px;color:var(--matt);margin-bottom:6px}
.notiztext{width:100%;min-height:62px;box-sizing:border-box;font:14px var(--druck);
   padding:8px 10px;border:1px solid var(--linie);border-radius:8px;
   background:#fff;color:var(--tinte);resize:vertical}
.notiztext:focus{outline:none;border-color:var(--akzent)}
.notizmalen{position:relative;margin-top:8px}
.notizblatt{display:block;width:100%;height:120px;background:#fff;
   border:1px dashed var(--akzent);border-radius:8px;cursor:crosshair;
   touch-action:none}
.notizhinweis{position:absolute;left:10px;top:6px;font-size:12px;
   color:var(--matt);pointer-events:none}
.notizknoepfe{display:flex;gap:8px;align-items:center;margin-top:8px}
.notizknoepfe button{font:inherit;font-size:13px;padding:6px 12px;
   border-radius:8px;border:1px solid var(--linie);background:var(--karte);
   color:var(--tinte);cursor:pointer}
.notizknoepfe button:hover{border-color:var(--akzent);color:var(--akzent)}
.notizstand{font-size:12px;color:#2E7D32}

.formel{font-family:'Pennstander Math','Cambria Math',Georgia,serif}
.formel .bruch{display:inline-flex;flex-direction:column;vertical-align:middle;
   text-align:center;line-height:1.06;margin:0 .15em}
.formel .bruch i:first-child{border-bottom:1px solid currentColor;font-style:normal}
.formel .bruch i{font-style:normal;padding:0 .18em}
.formel .quer{border-top:1px solid currentColor;padding-top:1px}

<script>
const D = {"welten": [{"kuerzel": "A.1", "welt": "Würfel", "kurz": "vertraut, kleine Zahlen — und die Referenzwelt", "bild": "bilder/Festigung_Wuerfel.png", "kontext": "Drei Würfel werden geworfen.\n <ul><li><b>(1)</b> mindestens eine gerade Augenzahl</li><li><b>(2)</b> mindestens eine Sechs</li><li><b>(3)</b> genau zwei zeigen dieselbe Zahl</li></ul>", "kapitel": {"1": {"name": "Zählen", "auftraege": ["Bestimmen Sie für alle drei die Anzahl der Möglichkeiten — wo möglich <b>auf zwei Wegen</b> — und zeichnen Sie jeweils das Urnenmodell.", "Zu <b>(3)</b> wurde Folgendes gerechnet. Warum stimmt das nicht?\n <div class=\"fehlerkasten\">«Augenzahl des Paars: <span class='formel'>6</span>. Dritte Zahl: <span class='formel'>6</span>. Stelle der dritten: <span class='formel'>3</span>.\n Also <span class='formel'>6·3·6=108</span>.»</div>", "Welche Strategien aus Ihrem Baukasten haben Sie jeweils verwendet?", "<i>Drei gleiche Würfel.</i> <span class=\"knacknuss\">Knacknuss</span> Die drei Würfel sind nicht zu\n unterscheiden — es zählt nur, welche Augenzahlen liegen, nicht welcher Würfel\n welche zeigt. Wie viele Ergebnisse gibt es dann?"], "loesung": "<p><b>Zählen.</b> (Geordnetes Modell, <span class='formel'>|Ω|=6<sup>3</sup>=216</span>.)<br><i>(1)</i> <span class='formel'>216-3<sup>3</sup>=189</span>; Fallsumme <span class='formel'>81+81+27</span>.<br><i>(2)</i> <span class='formel'>216-5<sup>3</sup>=91</span>; Fallsumme <span class='formel'>75+15+1</span>.<br><i>(3)</i> <span class='formel'>6·5·3=90</span>; oder <span class='formel'>216-6-120=90</span>.</p>\n<p><i>(b) Diagnose:</i> Das zweite <span class='formel'>· 6</span> lässt die dritte Zahl <i>beliebig</i> —\nalso auch gleich der Paarzahl. Damit rutschen die <span class='formel'>6</span> Drillinge hinein, und jedes\nPaar wird doppelt gezählt (einmal als «Paar <span class='formel'>a</span>, dritte <span class='formel'>b</span>», einmal als «Paar <span class='formel'>b</span>,\ndritte <span class='formel'>a</span>»). Richtig ist <i>anders</i> statt <i>beliebig</i>: <span class='formel'>6·5·3=90</span>.</p>\n<p><i>(c)</i> (1)/(2) Komplement bzw. Fallsumme; (3) Fallunterscheidung mit Position.</p>\n<p><i>(d) Knacknuss:</i> Jetzt zählt nur noch, <i>welche</i> Augenzahlen liegen —\nmit Wiederholung, ohne Reihenfolge. Plus-und-Balken: <span class='formel'><span class='binom'><i>6+3-1</i><i>3</i></span>=<span class='binom'><i>8</i><i>3</i></span>=56</span>.\n<i>Dieselbe Strategie wie beim Eis, S4 (drei Kugeln in den Becher, Sorten dürfen\nsich wiederholen).</i></p>"}, "2": {"name": "Ergebnismengen", "auftraege": ["Wählen Sie <i>eines</i> der drei Fallbeispiele. Stellen Sie <b>drei Ergebnismengen</b> auf: zwei, in denen sich das Fallbeispiel beschreiben lässt, und\n eine gültige, in der es <i>nicht</i> geht. Woran liegt der Unterschied?", "Warum ist die folgende Menge keine gültige Ergebnismenge für den Wurf mit\n drei Würfeln? <i>(Es gibt zwei Gründe.)</i>\n <div class=\"fehlerkasten\">«Ich nehme die Augensumme: <span class='formel'>Ω={2,3,4,…,12}</span>.»</div>", "Nennen Sie <span class='formel'>G₁</span>, <span class='formel'>G₂</span>, <span class='formel'>G₃</span> die Ereignisse »der erste / zweite / dritte\n Würfel zeigt eine gerade Zahl«. Schreiben Sie damit <b>Fallbeispiel (1)</b>\n auf — und ebenso sein Gegenereignis, auf <i>zwei</i> Arten. Was fällt beim\n Vergleich auf? Zeichnen Sie dazu ein Venn-Diagramm."], "loesung": "<p><b>Ergebnismengen.</b><br><i>(a) z. B. zu (2):</i> tauglich das <i>Augentripel</i> (<span class='formel'>216</span>) und »<i>Sechs\nja/nein</i> pro Würfel« (<span class='formel'>8</span>); <i>zu grob</i> die <i>Augensumme</i> — Summe <span class='formel'>12</span>\nentsteht mit (<span class='formel'>6+5+1</span>) und ohne (<span class='formel'>4+4+4</span>) Sechs. »Zu grob« heisst: das\nEreignis trennt Ergebnisse, welche die Menge zusammenwirft.</p>\n<p><i>(b) Zwei Mängel:</i> <i>Überschuss</i> — die <span class='formel'>2</span> tritt nie ein (Minimum <span class='formel'>3</span>);\n<i>Lücke</i> — <span class='formel'>13</span> bis <span class='formel'>18</span> fehlen. Eine Ergebnismenge muss genau die Ergebnisse\nenthalten, die eintreten können: keine Lücken, kein Überschuss.</p>\n<p><i>(c) Ereignisalgebra.</i><br><i>(1)</i> <span class='formel'>=G₁∪ G₂∪ G₃</span> (<span class='formel'>189</span>). <br><i>(3)</i> <span class='formel'>=(P₁₂∪ P₁₃∪ P₂₃)∖(P₁₂∩ P₁₃∩ P₂₃)</span>\n(<span class='formel'>96-6=90</span>).\n<i>»keine gerade«</i> <span class='formel'>=<span class='quer'>G₁∪ G₂∪ G₃</span>\n=<span class='quer'>G₁</span>∩<span class='quer'>G₂</span>∩<span class='quer'>G₃</span></span> (<span class='formel'>27</span>) — beide Wege führen zum\nselben Feld: das ist <b>De Morgan</b>, am Bild ablesbar.\n<i>Leere Felder:</i> Sobald zwei der <span class='formel'>P_ij</span> gelten, gilt auch das dritte (aus\n<span class='formel'>a=b</span> und <span class='formel'>a=c</span> folgt <span class='formel'>b=c</span>). Die drei Felder »genau zwei der <span class='formel'>P_ij</span>« sind\nalso <b>leer</b>; die Kreise überlappen nur im gemeinsamen Kern »alle drei gleich«.\nDeshalb ist <b>(3)</b> genau die Vereinigung <i>ohne</i> diesen Kern.</p>"}, "3": {"name": "Laplace", "auftraege": ["Bestimmen Sie die drei Wahrscheinlichkeiten — <i>wenn möglich</i> mit\n <b>zwei verschiedenen Ergebnismengen</b>.", "Stellen Sie den Zusammenhang zu Ihren <b>Prüffragen</b> aus der Reflexion\n her: Welche hat bei welchem Fallbeispiel den Ausschlag gegeben?", "Entlarven Sie den Fehler.\n <div class=\"fehlerkasten\">«Pro Würfel: Sechs oder nicht. Das sind <span class='formel'>2<sup>3</sup>=8</span> Muster, <span class='formel'>7</span> davon mit einer\n Sechs. Also <span class='formel'>P=<span class='bruch'><i>7</i><i>8</i></span></span>.»</div>"], "loesung": "<p><b>Wahrscheinlichkeit.</b><br><i>(a)</i> (1) <span class='formel'>=<span class='bruch'><i>189</i><i>216</i></span>=<span class='bruch'><i>7</i><i>8</i></span></span> — auf dem Augentripel <i>und</i> auf dem\ngerade/ungerade-Muster (<span class='formel'>7</span> von <span class='formel'>8</span> Feldern, je <span class='formel'><span class='bruch'><i>1</i><i>8</i></span></span>): zwei Ergebnismengen,\ngleiches Ergebnis. (2) <span class='formel'>=<span class='bruch'><i>91</i><i>216</i></span></span>, (3) <span class='formel'>=<span class='bruch'><i>90</i><i>216</i></span>=<span class='bruch'><i>5</i><i>12</i></span></span> —\nje nur auf dem Augentripel.</p>\n<p><i>(b)</i> Bei (2) und (3). Eine gröbere Ergebnismenge trägt nur dann, wenn ihre Teile\n<i>gleich wahrscheinlich</i> sind. Das gerade/ungerade-Muster erfüllt das (<span class='formel'>3:3</span> —\nje <span class='formel'><span class='bruch'><i>1</i><i>2</i></span></span>), das »Sechs ja/nein«-Muster nicht (<span class='formel'><span class='bruch'><i>1</i><i>6</i></span></span> gegen <span class='formel'><span class='bruch'><i>5</i><i>6</i></span></span>), und\nfür »genau zwei gleich« gibt es gar keine gröbere Menge, die das Ereignis trennt.</p>\n<p><i>(c) Diagnose:</i> Die <span class='formel'>8</span> Muster sind <i>nicht</i> gleich wahrscheinlich — »Sechs«\nhat <span class='formel'><span class='bruch'><i>1</i><i>6</i></span></span>, »keine Sechs« <span class='formel'><span class='bruch'><i>5</i><i>6</i></span></span>. Man darf nur zählen statt rechnen, wenn alle\nFälle gleich wiegen. Richtig: <span class='formel'><span class='bruch'><i>91</i><i>216</i></span>≈0,42</span> — nicht <span class='formel'><span class='bruch'><i>7</i><i>8</i></span></span>.</p>"}, "4": {"name": "Daten", "auftraege": ["Wie weit weicht das vom theoretischen Wert ab?", "Trägt der Verdacht? Nutzen Sie die Ungleichung aus Kapitel 4.", "Wie viele Würfe bräuchte es, damit Sie sich sicher wären?"], "loesung": null}}}, {"kuerzel": "A.2", "welt": "Bewerbung", "kurz": "Auswahl, Binomialkoeffizient, genau k", "bild": "bilder/Festigung_Bewerbung.png", "kontext": "Auf eine Stelle bewerben sich 10 Personen: 3 Frauen (Keller, Lang,\n Meier) und 7 Männer. Vier werden zum Gespräch eingeladen.\n <ul><li><b>(1)</b> mindestens eine Frau ist dabei</li><li><b>(2)</b> genau zwei Frauen sind dabei</li><li><b>(3)</b> Frau Keller ist dabei</li></ul>", "kapitel": {"1": {"name": "Zählen", "auftraege": ["Bestimmen Sie für alle drei die Anzahl der Möglichkeiten — wo möglich <b>auf zwei Wegen</b> — und zeichnen Sie jeweils das Urnenmodell.", "Zu <b>(2)</b> wurde Folgendes gerechnet. Warum stimmt das nicht?\n <div class=\"fehlerkasten\">«Die erste Frau: <span class='formel'>3</span>, die zweite: <span class='formel'>2</span>. Der erste Mann: <span class='formel'>7</span>, der zweite: <span class='formel'>6</span>.\n Also <span class='formel'>3·2·7·6=252</span>.»</div>", "Welche Strategien aus Ihrem Baukasten haben Sie jeweils verwendet?", "<i>Alle zehn im Gespräch.</i> <span class=\"knacknuss\">Knacknuss</span> Statt vier einzuladen werden alle\n zehn auf drei <i>gleichzeitige</i> Gespräche verteilt: eines mit vier Personen,\n zwei mit je drei. Wie viele Aufteilungen gibt es?"], "loesung": "<p><b>Zählen.</b> <span class='formel'>|Ω|=<span class='binom'><i>10</i><i>4</i></span>=210</span>.<br><i>(1)</i> <span class='formel'>210-<span class='binom'><i>7</i><i>4</i></span>=175</span>; Fallsumme <span class='formel'>105+63+7</span>.<br><i>(2)</i> <span class='formel'><span class='binom'><i>3</i><i>2</i></span><span class='binom'><i>7</i><i>2</i></span>=3·21=63</span>.<br><i>(3)</i> <span class='formel'><span class='binom'><i>9</i><i>3</i></span>=84</span> (Keller fest, drei aus den übrigen neun).</p>\n<p><i>(b) Diagnose:</i> Die Auswahl ist <i>ungeordnet</i> — »erste/zweite Frau« gibt es\nnicht. <span class='formel'>3·2</span> zählt jedes Frauenpaar zweimal, <span class='formel'>7·6</span> jedes Männerpaar zweimal;\n<span class='formel'>252=63·4</span>. Richtig: <span class='formel'><span class='binom'><i>3</i><i>2</i></span><span class='binom'><i>7</i><i>2</i></span>=63</span>.</p>\n<p><i>(c)</i> (1) Komplement/Fallsumme; (2) genau-<span class='formel'>k</span> als Produkt zweier Auswahlen;\n(3) ein Element fixieren.<br><i>(d) Alle zehn im Gespräch:</i> <span class='formel'><span class='binom'><i>10</i><i>4</i></span><span class='binom'><i>6</i><i>3</i></span><span class='binom'><i>3</i><i>3</i></span>=210·20·1=4200</span>\n— darin ist aber jede Aufteilung <i>zweimal</i> gezählt, weil die Gespräche\ngleichzeitig stattfinden und die beiden Dreiergruppen damit vertauschbar sind:\n<span class='formel'>4200/2!=2100</span>. <i>Dieselbe Strategie wie beim Eis, S16 (drei gleiche\nBecher) und beim Hotel (identische Bungalows): sind die Behälter gleichartig, teilt\nman durch ihre Vertauschungen.</i></p>"}, "2": {"name": "Ergebnismengen", "auftraege": ["Wählen Sie <i>eines</i> der drei Fallbeispiele und stellen Sie <b>drei Ergebnismengen</b> auf: zwei, die es beschreiben, und eine gültige, die dafür\n <i>zu grob</i> ist. Woran erkennen Sie »zu grob«?", "Warum ist das keine gültige Ergebnismenge?\n <div class=\"fehlerkasten\">«Ich notiere, was für eine Runde es wird:\n <span class='formel'>Ω={</span>reine Männerrunde, reine Frauenrunde<span class='formel'>}</span>.»</div>", "Nennen Sie <span class='formel'>K</span>, <span class='formel'>L</span>, <span class='formel'>M</span> die Ereignisse »Frau Keller / Lang / Meier ist\n dabei«. Zeichnen Sie das Venn und verorten Sie darin die drei Fallbeispiele.\n Welche davon lassen sich mit <span class='formel'>K</span>, <span class='formel'>L</span> und <span class='formel'>M</span> auch <i>aufschreiben</i>? Und:\n Lesen Sie am Bild ab, warum <span class='formel'>|K|+|L|+|M|</span> nicht die Antwort auf (1) ist."], "loesung": "<p><b>Ergebnismengen.</b><br><i>(a) z. B. zu (3):</i> tauglich »welche vier Personen« (<span class='formel'>210</span>) und »welche Frauen\nsind dabei« (<span class='formel'>8</span>); <i>zu grob</i> »Anzahl der Frauen« — sie sagt nicht, <i>welche</i>.<br><i>(b)</i> <b>Lücke:</b> Die allermeisten Runden sind <i>gemischt</i> und haben gar\nkein Notat. Eine Ergebnismenge muss jedes mögliche Ergebnis erfassen — genau eines.<br><i>(c)</i> <span class='formel'>(1)=K∪ L∪ M</span>, <span class='formel'>(3)=K</span>, <span class='formel'>(2)=</span> die drei Felder »genau zwei der drei«.\n»keine Frau« <span class='formel'>=<span class='quer'>K∪ L∪ M</span>=<span class='quer'>K</span>∩<span class='quer'>L</span>∩<span class='quer'>M</span>=35</span>\n— <b>De Morgan</b>. <span class='formel'>|K|+|L|+|M|=3·84=252</span> zählt die Überschneidungen mehrfach;\n<b>Inklusion-Exklusion:</b> <span class='formel'>252-3·28+7=175</span> (<span class='formel'>|K∩ L|=<span class='binom'><i>8</i><i>2</i></span>=28</span>,\n<span class='formel'>|K∩ L∩ M|=<span class='binom'><i>7</i><i>1</i></span>=7</span>).</p>"}, "3": {"name": "Laplace", "auftraege": ["Nehmen Sie an, die vier Eingeladenen werden <i>ausgelost</i>. Bestimmen Sie\n die drei Wahrscheinlichkeiten — <i>wenn möglich</i> mit <b>zwei\n verschiedenen Ergebnismengen</b>.", "Stellen Sie den Zusammenhang zu Ihren <b>Prüffragen</b> aus der Reflexion\n her: Welche hat bei welchem Fallbeispiel den Ausschlag gegeben?", "Entlarven Sie den Fehler.\n <div class=\"fehlerkasten\">«Es sind <span class='formel'>0</span>, <span class='formel'>1</span>, <span class='formel'>2</span> oder <span class='formel'>3</span> Frauen dabei — vier Fälle, drei davon mit\n mindestens einer Frau. Also <span class='formel'>P=<span class='bruch'><i>3</i><i>4</i></span></span>.»</div>"], "loesung": "<p><b>Wahrscheinlichkeit.</b><br><i>(a)</i> <span class='formel'>P(1)=<span class='bruch'><i>175</i><i>210</i></span>=<span class='bruch'><i>5</i><i>6</i></span></span>, <span class='formel'>P(2)=<span class='bruch'><i>63</i><i>210</i></span>=<span class='bruch'><i>3</i><i>10</i></span></span>,\n<span class='formel'>P(3)=<span class='bruch'><i>84</i><i>210</i></span>=<span class='bruch'><i>2</i><i>5</i></span></span>. Zweite Ergebnismenge: die <i>geordnete</i> Auswahl\n(<span class='formel'>10·9·8·7=5040</span>), z. B. <span class='formel'>P(1)=<span class='bruch'><i>5040-840</i><i>5040</i></span>=<span class='bruch'><i>5</i><i>6</i></span></span> —\nauch sie ist Laplace, also gleiches Ergebnis.<br><i>(b)</i> »Anzahl der Frauen« ist gültig, aber <b>nicht Laplace</b>: die vier Werte\nwiegen <span class='formel'>35</span>, <span class='formel'>105</span>, <span class='formel'>63</span>, <span class='formel'>7</span>. Zählen statt rechnen darf man nur, wenn alle Fälle\ngleich wiegen — hier steht die Kategorie <span class='formel'>7:3</span>.<br><i>(c) Diagnose:</i> genau dieser Fehler. Die vier Fälle sind nicht gleich\nwahrscheinlich; <span class='formel'><span class='bruch'><i>3</i><i>4</i></span>=0,75</span> statt <span class='formel'><span class='bruch'><i>5</i><i>6</i></span>≈0,83</span>.</p>"}, "4": {"name": "Daten", "auftraege": ["Wie weit weicht das von dem ab, was bei einer Auslosung zu erwarten wäre?", "Lässt sich die Annahme aus dem letzten Block — es werde ausgelost —\n aufrechterhalten? Nutzen Sie die Ungleichung aus Kapitel 4.", "Ab wie vielen Einladungen hätte Sie dieselbe Abweichung überzeugt?"], "loesung": "<p><b>Daten.</b><br><i>(a)</i> Erwartet wären <span class='formel'>30 %</span>, gemessen <span class='formel'><span class='bruch'><i>90</i><i>500</i></span>=18 %</span> —\nAbweichung <span class='formel'>d=0,12</span>.<br><i>(b)</i> <span class='formel'><span class='bruch'><i>1</i><i>4·500·0,12<sup>2</sup></i></span>≈0,035</span>: Wäre wirklich\nausgelost worden, hätte eine Abweichung dieser Grösse höchstens <span class='formel'>3,5 %</span>\nWahrscheinlichkeit. <b>Die Annahme lässt sich nicht aufrechterhalten</b> —\nanders als beim Würfel und beim Festival, wo die Daten nichts hergaben.<br><i>(c)</i> Bei derselben Abweichung genügen rund <span class='formel'>350</span> Einladungen für eine\nSchranke unter <span class='formel'>5 %</span>; bei nur <span class='formel'>250</span> Einladungen und einer kleineren Abweichung\n(etwa <span class='formel'>60</span> Frauen) wären es <span class='formel'>27 %</span> — dann trüge der Verdacht nicht.\nDie Zahl allein entscheidet nicht: es kommt auf Abweichung <i>und</i>\nDatenmenge an.</p>"}}}, {"kuerzel": "A.3", "welt": "Restaurant", "kurz": "Verkettung anschaulich, Plus-und-Balken als erste Hürde", "bild": "bilder/Festigung_Restaurant.png", "kontext": "Ein Restaurant bietet ein Menü aus drei Gängen an: eine Vorspeise (3 zur Wahl),\n einen Hauptgang (5, darunter ein Fischgericht) und ein Dessert (2). Dazu wählen\n Sie drei Portionen Beilagen aus vier Sorten — dieselbe Sorte darf mehrfach\n vorkommen, und auf dem Teller spielt die Reihenfolge keine Rolle.\n <ul><li><b>(1)</b> der Hauptgang ist das Fischgericht</li><li><b>(2)</b> die drei Beilagen sind alle verschieden</li><li><b>(3)</b> mindestens eine Portion ist Pommes</li></ul>", "kapitel": {"1": {"name": "Zählen", "auftraege": ["Wie viele Bestellungen gibt es überhaupt? Bestimmen Sie dann alle drei\n Fallbeispiele — wo möglich <b>auf zwei Wegen</b> — und zeichnen Sie jeweils\n das Urnenmodell.", "Zur <b>Gesamtzahl</b> wurde Folgendes gerechnet. Warum stimmt das nicht?\n <div class=\"fehlerkasten\">«Drei Gänge: <span class='formel'>3·5·2=30</span>. Dann drei Beilagen, für jede vier Sorten:\n <span class='formel'>4<sup>3</sup>=64</span>. Also <span class='formel'>30·64=1920</span>.»</div>", "Welche Strategien aus Ihrem Baukasten haben Sie jeweils verwendet?", "<i>Weniger Gänge.</i> <span class=\"knacknuss\">Knacknuss</span> Vorspeise und Dessert dürfen auch\n weggelassen werden, der Hauptgang ist Pflicht. Wie viele Menüs gibt es dann —\n ohne Beilagen gerechnet? Finden Sie <i>zwei</i> Wege."], "loesung": "<p><b>Zählen.</b> <span class='formel'>|Ω|=(3·5·2 = 30)·\n(<span class='binom'><i>4+3-1</i><i>3</i></span> = 20)=600</span>. Zwei verkettete Stufen: erst das Menü\n(drei verschiedene Urnen nacheinander), dann die Beilagen (drei Portionen aus vier\nSorten, mit Wiederholung, ohne Reihenfolge — Plus-und-Balken).<br><i>(1)</i> <span class='formel'>3·1·2·20=120</span>.<br><i>(2)</i> <span class='formel'>30·<span class='binom'><i>4</i><i>3</i></span>=30·4=120</span> — drei verschiedene der vier Sorten.<br><i>(3)</i> Komplement: <span class='formel'>30·(20-<span class='binom'><i>3+3-1</i><i>3</i></span>)=30·(20-10)=300</span>.</p>\n<p><i>(b) Diagnose:</i> <span class='formel'>4<sup>3</sup>=64</span> zählt die Beilagen <i>geordnet</i> — als wäre\n»Pommes, Salat, Salat« etwas anderes als »Salat, Pommes, Salat«. Auf dem Teller\ngibt es keine Reihenfolge. Richtig sind <span class='formel'><span class='binom'><i>6</i><i>3</i></span>=20</span> Zusammenstellungen, also\n<span class='formel'>600</span>.<br>(Teilen liesse sich hier nicht einfach: die <span class='formel'>64</span> verteilen sich\nungleich auf die <span class='formel'>20</span> — genau die Einsicht aus A.3.)</p>\n<p><i>(c)</i> <span class='formel'>|Ω|</span>: Verkettung <i>und</i> Plus-und-Balken; (1) eine Stufe\nfestlegen; (2) Auswahl ohne Wiederholung; (3) Komplement.</p>\n<p><i>(d) Knacknuss:</i> <i>Fälle addieren</i> — drei Gänge <span class='formel'>3·5·2=30</span>, nur\nHauptgang und Dessert <span class='formel'>5·2=10</span>, nur Vorspeise und Hauptgang <span class='formel'>3·5=15</span>, nur\nHauptgang <span class='formel'>5</span>; zusammen <span class='formel'>60</span>.\n<i>Zweiter Weg:</i> »keine Vorspeise« als <i>vierte</i> Möglichkeit mitzählen und\n»kein Dessert« als <i>dritte</i>: <span class='formel'>4·5·3=60</span>. <i>Das Weglassen ist\nselbst eine Wahl — dann wird aus dem Addieren wieder ein Produkt.</i></p>"}, "2": {"name": "Ergebnismengen", "auftraege": ["Wählen Sie <i>eines</i> der drei Fallbeispiele. Stellen Sie <b>drei\n Ergebnismengen</b> auf: zwei, in denen sich das Fallbeispiel beschreiben lässt, und\n eine gültige, in der es <i>nicht</i> geht. Woran liegt der Unterschied?", "Warum ist die folgende Menge keine gültige Ergebnismenge?\n <div class=\"fehlerkasten\">«Ich notiere, wie viele verschiedene Beilagensorten auf dem Teller liegen:\n <span class='formel'>Ω={1,2,3,4}</span>.»</div>", "Nennen Sie <span class='formel'>P</span> das Ereignis »mindestens eine Portion Pommes« und <span class='formel'>F</span> das\n Ereignis »der Hauptgang ist Fisch«. Sind <span class='formel'>P</span> und <span class='formel'>F</span> disjunkt? Bestimmen Sie\n <span class='formel'>|P∪ F|</span> auf <i>zwei</i> Arten — direkt und über <span class='formel'>|P|+|F|-|P∩ F|</span>."], "loesung": "<p><b>Ergebnismengen.</b><br><i>(a) z. B. zu (1):</i> tauglich »welche Bestellung« (<span class='formel'>600</span>) und »welcher\nHauptgang« (<span class='formel'>5</span>); <i>nicht</i> tauglich »welche Beilagen« — daraus geht der\nHauptgang nicht hervor.<br><i>(b)</i> <b>Überschuss:</b> Bei drei Portionen können höchstens <i>drei</i>\nverschiedene Sorten auftreten; der Wert <span class='formel'>4</span> tritt nie ein.<br><i>(c)</i> <span class='formel'>P</span> und <span class='formel'>F</span> sind <i>nicht</i> disjunkt — ein Fischgericht mit Pommes\ngibt es sehr wohl. <span class='formel'>|P|=300</span>, <span class='formel'>|F|=120</span>, <span class='formel'>|P∩ F|=1·…=60</span> (Fisch fest,\nBeilagen mit Pommes: <span class='formel'>3·1·2·10=60</span>). Also <span class='formel'>|P∪ F|=300+120-60=360</span>;\ndirekt: <span class='formel'>600-(240 = <span class='wort'>kein Fisch, keine Pommes</span>)=360</span>.</p>"}, "3": {"name": "Laplace", "auftraege": ["Nehmen Sie an, ein Gast bestellt <i>blind</i> — jede Bestellung ist gleich\n wahrscheinlich. Bestimmen Sie die drei Wahrscheinlichkeiten — <i>wenn möglich</i>\n mit <b>zwei verschiedenen Ergebnismengen</b>.", "Stellen Sie den Zusammenhang zu Ihren <b>Prüffragen</b> aus der Reflexion\n her: Welche hat bei welchem Fallbeispiel den Ausschlag gegeben?", "Entlarven Sie den Fehler.\n <div class=\"fehlerkasten\">«Es gibt vier Beilagensorten und drei Portionen. Für jede Portion ist die\n Wahrscheinlichkeit <span class='formel'><span class='bruch'><i>1</i><i>4</i></span></span>, dass es Pommes sind — bei drei Portionen also\n <span class='formel'>3·<span class='bruch'><i>1</i><i>4</i></span>=<span class='bruch'><i>3</i><i>4</i></span></span>.»</div>"], "loesung": "<p><b>Laplace.</b> Jede der <span class='formel'>600</span> Bestellungen ist gleich wahrscheinlich.<br><i>(a)</i> <span class='formel'>P(1)=<span class='bruch'><i>120</i><i>600</i></span>=<span class='bruch'><i>1</i><i>5</i></span></span> — <i>und</i> auf der groben Menge\n»welcher Hauptgang« ebenfalls <span class='formel'><span class='bruch'><i>1</i><i>5</i></span></span>: zwei Ergebnismengen, gleiches Ergebnis.\n<span class='formel'>P(2)=<span class='bruch'><i>120</i><i>600</i></span>=<span class='bruch'><i>1</i><i>5</i></span></span>, <span class='formel'>P(3)=<span class='bruch'><i>300</i><i>600</i></span>=<span class='bruch'><i>1</i><i>2</i></span></span>; beide auch auf\nder groben Menge »welche Beilagen« (<span class='formel'>20</span> Werte) — <b>Vorsicht:</b> die <span class='formel'>20</span>\nsind <i>nicht</i> gleich wahrscheinlich, wenn man die Portionen einzeln zieht.\nHier sind sie es, weil die Bestellung als Ganzes gleichverteilt ist.<br><i>(b)</i> Bei (1) trägt die grobe Menge, bei (2) und (3) die Beilagen-Menge —\nin allen Fällen, weil die gröbere Menge das Ereignis <i>trennt</i>.<br><i>(c) Diagnose:</i> Die drei Portionen schliessen sich nicht aus — es können\nmehrere Pommes sein. Wahrscheinlichkeiten einfach zu addieren ist nur bei\n<i>disjunkten</i> Ereignissen erlaubt. Richtig: Komplement,\n<span class='formel'>1-<span class='bruch'><i>10</i><i>20</i></span>=<span class='bruch'><i>1</i><i>2</i></span></span>.</p>"}, "4": {"name": "Daten", "auftraege": ["Wie weit weicht das von dem ab, was bei blinder Bestellung zu erwarten wäre?", "Trägt die Vermutung? Nutzen Sie die Ungleichung aus Kapitel 4.", "Was würde sich ändern, wenn er nur <span class='formel'>80</span> Bestellungen gezählt hätte?"], "loesung": "<p><b>Daten.</b><br><i>(a)</i> Erwartet <span class='formel'><span class='bruch'><i>1</i><i>5</i></span>=0,200</span>, gemessen <span class='formel'><span class='bruch'><i>224</i><i>800</i></span>=0,280</span> —\nAbweichung <span class='formel'>d=0,080</span>.<br><i>(b)</i> <span class='formel'><span class='bruch'><i>1</i><i>4·800·0,080<sup>2</sup></i></span>≈0,049</span>: unter <span class='formel'>5 %</span> —\n<b>die Vermutung trägt</b>.<br><i>(c)</i> Bei nur <span class='formel'>80</span> Bestellungen wäre die Schranke zehnmal so gross\n(<span class='formel'>≈0,49</span>) — dieselbe Abweichung, aber kein Argument mehr.</p>"}}}, {"kuerzel": "A.4", "welt": "Mensa", "kurz": "zyklisch — begrifflich anspruchsvoll, kleiner Apparat", "bild": "bilder/Festigung_Mensa.png", "kontext": "In der Mensa steht ein grosser runder Tisch mit acht Plätzen. Acht Studierende\n setzen sich — darunter Anna und Ben sowie vier Erstsemester. Gedrehte\n Sitzordnungen gelten als gleich.\n <ul><li><b>(1)</b> Anna und Ben sitzen nebeneinander</li><li><b>(2)</b> Anna sitzt direkt links von Ben</li><li><b>(3)</b> die vier Erstsemester sitzen alle nebeneinander</li></ul>", "kapitel": {"1": {"name": "Zählen", "auftraege": ["Wie viele Sitzordnungen gibt es überhaupt? Bestimmen Sie dann alle drei\n Fallbeispiele — wo möglich <b>auf zwei Wegen</b> — und zeichnen Sie jeweils\n das Urnenmodell.", "Zu <b>(1)</b> wurde Folgendes gerechnet. Warum stimmt das nicht?\n <div class=\"fehlerkasten\">«Anna und Ben bilden einen Block. Der kann an <span class='formel'>7</span> Stellen sitzen, innen gibt\n es <span class='formel'>2</span> Reihenfolgen, die übrigen sechs sitzen beliebig: <span class='formel'>7·2·6!=10 080</span>.»</div>", "Welche Strategien aus Ihrem Baukasten haben Sie jeweils verwendet?", "<i>Abwechselnd.</i> <span class=\"knacknuss\">Knacknuss</span> Die vier Erstsemester sollen so sitzen, dass\n neben jedem von ihnen zwei Ältere sitzen — Erstsemester und Ältere wechseln sich\n also rundherum ab. Wie viele Sitzordnungen gibt es dann?"], "loesung": "<p><b>Zählen.</b> <span class='formel'>|Ω|=(8-1)!=5040</span>: eine Person festsetzen, damit die acht\nDrehungen jeder Sitzordnung nicht mehrfach gezählt werden. <i>Zweiter Weg:</i>\n<span class='formel'><span class='bruch'><i>8!</i><i>8</i></span>=5040</span>.<br><i>(1)</i> Anna festsetzen; Ben hat <span class='formel'>2</span> der <span class='formel'>7</span> übrigen Plätze neben ihr, die\nrestlichen sechs sitzen beliebig: <span class='formel'>2·6!=1440</span>.<br><i>(2)</i> Wie (1), aber nur eine der beiden Seiten: <span class='formel'>6!=720</span> — genau die Hälfte.<br><i>(3)</i> Die vier Erstsemester als ein Objekt: fünf Objekte am runden Tisch,\n<span class='formel'>(5-1)!=24</span>; innen <span class='formel'>4!=24</span>; zusammen <span class='formel'>576</span>.</p>\n<p><i>(b) Diagnose:</i> Am runden Tisch gibt es <i>keine</i> sieben Anfangsstellen —\ndas wäre eine Reihe. Die Drehungen sind bereits herausgerechnet (<span class='formel'>|Ω|=7!</span>,\nnicht <span class='formel'>8!</span>), der Faktor <span class='formel'>7</span> zählt sie ein zweites Mal. Richtig: <span class='formel'>2·6!=1440</span>.<br>(Probe: <span class='formel'>10 080</span> ist doppelt so gross wie <span class='formel'>|Ω|=5040</span>.)</p>\n<p><i>(c)</i> <span class='formel'>|Ω|</span>: zyklisch, Teilen durch die Drehungen; (1) Block mit freier\ninnerer Reihenfolge; (2) Block mit fester; (3) grosser Block, wieder zyklisch.</p>\n<p><i>(d) Knacknuss:</i> Abwechselnd heisst: die vier Erstsemester besetzen jeden\nzweiten Platz. Setzt man einen von ihnen fest, bleiben <span class='formel'>(4-1)!=6</span> Anordnungen für\ndie Erstsemester auf ihren vier Plätzen und <span class='formel'>4!=24</span> für die Älteren auf den\ndazwischen: <span class='formel'>6·24=144</span>. <i>Zwei Einsichten auf einmal — die zyklische\nSymmetrie und die Zerlegung in zwei verschränkte Kreise.</i></p>"}, "2": {"name": "Ergebnismengen", "auftraege": ["Wählen Sie <i>eines</i> der drei Fallbeispiele. Stellen Sie <b>drei\n Ergebnismengen</b> auf: zwei, in denen sich das Fallbeispiel beschreiben lässt, und\n eine gültige, in der es <i>nicht</i> geht. Woran liegt der Unterschied?", "Warum ist die folgende Menge keine gültige Ergebnismenge?\n <div class=\"fehlerkasten\">«Ich notiere, neben wem Anna sitzt: <span class='formel'>Ω={</span>neben Ben, neben einem\n Erstsemester<span class='formel'>}</span>.»</div>", "Nennen Sie <span class='formel'>L</span> und <span class='formel'>R</span> die Ereignisse »Ben sitzt links von Anna« bzw.\n »rechts von ihr«. Schreiben Sie <b>(1)</b> damit auf. Sind <span class='formel'>L</span> und <span class='formel'>R</span>\n disjunkt? Und was ist <span class='formel'><span class='quer'>L∪ R</span></span>? Zeichnen Sie ein Bild dazu."], "loesung": "<p><b>Ergebnismengen.</b><br><i>(a) z. B. zu (2):</i> tauglich »wer auf welchem Platz sitzt« (<span class='formel'>5040</span>) und\n»wer neben Anna sitzt, links und rechts«; <i>nicht</i> tauglich »wer neben wem\nsitzt« ohne Seitenangabe — daraus geht »links von« nicht hervor.<br><i>(b)</i> Die beiden Fächer schliessen sich weder aus noch decken sie alles ab:\nBen <i>kann</i> Erstsemester sein, und Annas Nachbarn können beide weder Ben noch\nErstsemester sein. <b>Überschneidung und Lücke zugleich.</b><br><i>(c)</i> <span class='formel'>(1)=L∪ R</span>. <span class='formel'>L</span> und <span class='formel'>R</span> sind <b>disjunkt</b> — Ben sitzt nicht\nzugleich links und rechts von Anna. <span class='formel'><span class='quer'>L∪ R</span></span> heisst »Ben sitzt nicht\nneben Anna« (<span class='formel'>5040-1440=3600</span>). Da <span class='formel'>L</span> und <span class='formel'>R</span> disjunkt sind, gilt\n<span class='formel'>|L∪ R|=|L|+|R|</span> — <i>hier</i> darf man einfach addieren, anders als bei\n<span class='formel'>K</span>, <span class='formel'>L</span>, <span class='formel'>M</span> in der Bewerbung.</p>"}, "3": {"name": "Laplace", "auftraege": ["Nehmen Sie an, die acht setzen sich <i>zufällig</i>. Bestimmen Sie die drei\n Wahrscheinlichkeiten — <i>wenn möglich</i> mit <b>zwei verschiedenen\n Ergebnismengen</b>.", "Stellen Sie den Zusammenhang zu Ihren <b>Prüffragen</b> aus der Reflexion\n her: Welche hat bei welchem Fallbeispiel den Ausschlag gegeben?", "Entlarven Sie den Fehler.\n <div class=\"fehlerkasten\">«Es gibt <span class='formel'>8</span> Plätze. Ben sitzt auf einem davon, und zwei der acht sind\n Annas Nachbarplätze. Also ist <span class='formel'>P=<span class='bruch'><i>2</i><i>8</i></span>=<span class='bruch'><i>1</i><i>4</i></span></span>.»</div>"], "loesung": "<p><b>Laplace.</b> Jede der <span class='formel'>5040</span> Sitzordnungen ist gleich wahrscheinlich.<br><i>(a)</i> <span class='formel'>P(1)=<span class='bruch'><i>1440</i><i>5040</i></span>=<span class='bruch'><i>2</i><i>7</i></span></span>; <span class='formel'>P(2)=<span class='bruch'><i>720</i><i>5040</i></span>=<span class='bruch'><i>1</i><i>7</i></span></span>;\n<span class='formel'>P(3)=<span class='bruch'><i>576</i><i>5040</i></span>=<span class='bruch'><i>4</i><i>35</i></span></span>. Für (1) und (2) trägt auch die gröbere Menge\n»welchen der sieben Plätze relativ zu Anna hat Ben« (<span class='formel'>7</span> gleich wahrscheinliche\nWerte): <span class='formel'>2</span> bzw. <span class='formel'>1</span> davon sind günstig.<br><i>(b)</i> (3) braucht die feine Menge.<br><i>(c) Diagnose:</i> Gezählt werden hier <i>Plätze</i>, aber Anna besetzt selbst\nschon einen. Für Ben bleiben <span class='formel'>7</span> Plätze, nicht <span class='formel'>8</span> — und <span class='formel'>2</span> davon sind\nNachbarplätze: <span class='formel'><span class='bruch'><i>2</i><i>7</i></span></span>, nicht <span class='formel'><span class='bruch'><i>2</i><i>8</i></span></span>.</p>"}, "4": {"name": "Daten", "auftraege": ["Wie weit weicht das von dem ab, was bei zufälliger Platzwahl zu erwarten wäre?", "Trägt die Behauptung? Nutzen Sie die Ungleichung aus Kapitel 4.", "Diskutieren Sie: Würden Sie Anna glauben?"], "loesung": "<p><b>Daten.</b><br><i>(a)</i> Erwartet <span class='formel'><span class='bruch'><i>2</i><i>7</i></span>≈0,286</span>, gemessen\n<span class='formel'><span class='bruch'><i>193</i><i>500</i></span>=0,386</span> — Abweichung <span class='formel'>d≈0,100</span>.<br><i>(b)</i> <span class='formel'><span class='bruch'><i>1</i><i>4·500·0,100<sup>2</sup></i></span>=0,050</span>: genau <span class='formel'>5 %</span>.<br><i>(c)</i> Ein Grenzfall. Bei <span class='formel'>5 %</span> lässt sich beides vertreten; wer die Schranke\nbei <span class='formel'>1 %</span> zieht, glaubt Anna nicht, wer sie bei <span class='formel'>10 %</span> zieht, schon.\n<i>Die Mathematik liefert die Zahl, die Entscheidung trifft sie nicht.</i></p>"}}}, {"kuerzel": "A.5", "welt": "Hotel", "kurz": "Teilen durch Symmetrie, die schwerste Einzelidee", "bild": "bilder/Festigung_Hotel.png", "kontext": "Ein Hotel hat drei Doppelzimmer (Nr. 1, 2, 3). Sechs Gäste\n werden zufällig auf die Zimmer verteilt — darunter Herr und Frau Brügger\n sowie Herr und Frau Keller. Innerhalb eines Zimmers spielt es keine Rolle,\n wer welches Bett nimmt.\n <ul><li><b>(1)</b> Herr und Frau Brügger teilen ein Zimmer</li><li><b>(2)</b> Herr Brügger wohnt in Zimmer 1</li><li><b>(3)</b> beide Paare teilen je ein Zimmer</li></ul>", "kapitel": {"1": {"name": "Zählen", "auftraege": ["Wie viele Zimmerbelegungen gibt es überhaupt? Bestimmen Sie dann alle drei\n Fallbeispiele und zeichnen Sie die Urnenmodelle — wo möglich auf zwei Wegen.", "Zur <b>Gesamtzahl</b> wurde Folgendes gerechnet. Warum stimmt das nicht?\n <div class=\"fehlerkasten\">«Sechs Gäste auf sechs Betten — das sind <span class='formel'>6!=720</span> Belegungen.»</div>", "<i>Dieselben Gäste, andere Zimmer.</i> <span class=\"knacknuss\">Knacknuss</span> Die drei Zimmer werden durch drei <b>identische\n Bungalows</b> ersetzt — man kann sie nicht auseinanderhalten. Wie viele Belegungen\n gibt es jetzt? Welche Strategie brauchen Sie, und wo im Eis kam sie schon vor?"], "loesung": "<p><b>Zählen.</b> <span class='formel'>|Ω|=<span class='bruch'><i>6!</i><i>(2!)<sup>3</sup></i></span>=<span class='bruch'><i>720</i><i>8</i></span>=90</span>; oder sukzessive\n<span class='formel'><span class='binom'><i>6</i><i>2</i></span><span class='binom'><i>4</i><i>2</i></span><span class='binom'><i>2</i><i>2</i></span>=15·6·1=90</span> (Zimmer 1, dann 2, dann 3 besetzen).<br><i>(1)</i> Brüggers zusammen: <span class='formel'>3</span> Zimmer für das Paar <span class='formel'>·\\ <span class='bruch'><i>4!</i><i>(2!)<sup>2</sup></i></span>=6</span>\nfür die übrigen vier <span class='formel'>=18</span>.<br><i>(2)</i> Herr Brügger in Zimmer 1: <span class='formel'>5</span> mögliche Zimmergenossen <span class='formel'>·</span> <span class='formel'><span class='bruch'><i>4!</i><i>(2!)<sup>2</sup></i></span>=6</span>\nBelegungen der übrigen zwei Zimmer <span class='formel'>=30</span>; kürzer: er wohnt gleich wahrscheinlich in\neinem der drei Zimmer, also <span class='formel'>90/3=30</span>.<br><i>(3)</i> beide Paare zusammen: <span class='formel'>3·2·1=6</span>.</p>\n<p><i>(b) Diagnose:</i> <span class='formel'>6!</span> zählt auch, <i>welches Bett</i> jemand im Zimmer nimmt —\ndas soll aber nicht unterschieden werden. Je Zimmer sind <span class='formel'>2!</span> Belegungen dieselbe,\nbei drei Zimmern also <span class='formel'>(2!)<sup>3</sup>=8</span>: <span class='formel'>720/8=90</span>.</p>\n<p><i>(c) Andere Zimmer:</i> Jetzt sind zusätzlich die drei <i>Behälter</i> vertauschbar —\njede Belegung wird <span class='formel'>3!=6</span>-mal gezählt: <span class='formel'>90/3!=15</span>. Also\n<span class='formel'><span class='bruch'><i>6!</i><i>(2!)<sup>3</sup>·3!</i></span>=15</span>. Dieselbe Strategie wie beim Eis, S16: sechs\nSorten auf drei gleiche Becher — auch dort <span class='formel'>15</span>.</p>"}, "2": {"name": "Ergebnismengen", "auftraege": ["Stellen Sie <b>zwei Ergebnismengen</b> auf: eine, die festhält <i>wer in\n welchem Zimmer</i> wohnt, und eine gröbere, die nur festhält <i>wer mit wem</i>. Wie\n viele Elemente hat jede? Welches der drei Fallbeispiele lässt sich mit der gröberen\n <i>nicht</i> beschreiben?", "Warum ist das keine gültige Ergebnismenge?\n <div class=\"fehlerkasten\">«Ich notiere, welches Paar zusammen wohnt:\n <span class='formel'>Ω={</span>Brügger zusammen, Keller zusammen<span class='formel'>}</span>.»</div>", "Setzen Sie <span class='formel'>B=</span> »Brüggers zusammen« und <span class='formel'>K=</span> »Kellers zusammen«. Schreiben Sie\n <b>(3)</b> symbolisch. Sind <span class='formel'>B</span> und <span class='formel'>K</span> disjunkt? Bestimmen Sie <span class='formel'>|B∪ K|</span> auf\n zwei Arten und zeichnen Sie das Venn."], "loesung": "<p><b>Ergebnismengen.</b><br><i>(a)</i> »wer in welchem Zimmer« (<span class='formel'>90</span>) und »wer mit wem« (<span class='formel'>15</span> Paarungen).\nMit der gröberen lässt sich <b>(2)</b> nicht beschreiben — sie verrät die\nZimmernummer nicht. (1) und (3) leben auf beiden.<br><i>(b)</i> <b>Lücke und Überschneidung zugleich:</b> Belegungen, in denen\n<i>keines</i> der Paare zusammen wohnt, haben kein Notat (Lücke); und wenn\n<i>beide</i> zusammen wohnen — Fallbeispiel (3)! — passen beide Einträge\n(Überschneidung).<br><i>(c)</i> <span class='formel'>(3)=B∩ K</span>. <i>Nicht</i> disjunkt, denn <span class='formel'>B∩ K</span> hat <span class='formel'>6</span> Elemente.\n<span class='formel'>|B∪ K|=18+18-6=30</span>; direkt: <span class='formel'>90-60=30</span> (in <span class='formel'>60</span> Belegungen wohnt kein Paar\nzusammen).</p>"}, "3": {"name": "Laplace", "auftraege": ["Bestimmen Sie die drei Wahrscheinlichkeiten — <i>wenn möglich</i> mit\n <b>zwei verschiedenen Ergebnismengen</b>.", "Stellen Sie den Zusammenhang zu Ihren <b>Prüffragen</b> aus der Reflexion\n her: Welche hat bei welchem Fallbeispiel den Ausschlag gegeben?", "Hier gelingen <i>überall</i> zwei Ergebnismengen — bei der Mensa dagegen\n führte die gröbere zu einer falschen Zahl. Woran liegt der Unterschied?", "Entlarven Sie den Fehler.\n <div class=\"fehlerkasten\">«Die Zimmernummern sind ja eigentlich egal, also gibt es nur <span class='formel'>15</span>\n Belegungen. Günstig für (1) sind <span class='formel'>18</span>. Also <span class='formel'>P=<span class='bruch'><i>18</i><i>15</i></span></span>.»</div>"], "loesung": "<p><b>Wahrscheinlichkeit.</b><br><i>(a)</i> <span class='formel'>P(1)=<span class='bruch'><i>18</i><i>90</i></span>=<span class='bruch'><i>1</i><i>5</i></span></span> — grob: <span class='formel'><span class='bruch'><i>3</i><i>15</i></span>=<span class='bruch'><i>1</i><i>5</i></span></span>.\n<span class='formel'>P(2)=<span class='bruch'><i>30</i><i>90</i></span>=<span class='bruch'><i>1</i><i>3</i></span></span> — grob über »welches Zimmer hat Herr Brügger«:\n<span class='formel'><span class='bruch'><i>1</i><i>3</i></span></span>. <span class='formel'>P(3)=<span class='bruch'><i>6</i><i>90</i></span>=<span class='bruch'><i>1</i><i>15</i></span></span> — grob: <span class='formel'><span class='bruch'><i>1</i><i>15</i></span></span>.<br><i>(b)</i> Weil hier <i>jede</i> Paarung gleich schwer wiegt: zu jeder gehören genau\n<span class='formel'>3!=6</span> Zimmerbelegungen (<span class='formel'>15·6=90</span>). Beim Buffet dagegen gehörten zu einer\nZusammenstellung <i>unterschiedlich viele</i> Reihenfolgen (<span class='formel'>1</span>, <span class='formel'>3</span> oder <span class='formel'>6</span>) —\ndarum war die grobe Menge dort nicht Laplace.<br><i>(c) Diagnose:</i> Zähler und Nenner stammen aus <i>verschiedenen</i>\nErgebnismengen — <span class='formel'>18</span> zählt Zimmerbelegungen, <span class='formel'>15</span> zählt Paarungen. Schon\n<span class='formel'><span class='bruch'><i>18</i><i>15</i></span>&gt;1</span> zeigt, dass das nicht sein kann. Richtig ist entweder\n<span class='formel'><span class='bruch'><i>18</i><i>90</i></span></span> oder <span class='formel'><span class='bruch'><i>3</i><i>15</i></span></span> — beide <span class='formel'><span class='bruch'><i>1</i><i>5</i></span></span>.</p>"}, "4": {"name": "Daten", "auftraege": ["Wie weit weicht das von dem ab, was bei zufälliger Zuteilung zu erwarten wäre?", "Trägt die Behauptung? Nutzen Sie die Ungleichung aus Kapitel 4.", "Etwas Merkwürdiges kommt heraus. Was bedeutet das?"], "loesung": "<p><b>Daten.</b><br><i>(a)</i> Erwartet <span class='formel'>P(<span class='wort'>Paar zusammen</span>)=<span class='bruch'><i>1</i><i>5</i></span>=0,200</span>; gemessen\n<span class='formel'><span class='bruch'><i>2</i><i>5</i></span>=0,400</span> — Abweichung <span class='formel'>d=0,200</span>.<br><i>(Die Familie fand es zu selten,\ngemessen ist es sogar häufiger — schon das lohnt eine Bemerkung.)</i><br><i>(b)</i> <span class='formel'><span class='bruch'><i>1</i><i>4·5·0,200<sup>2</sup></i></span>=1,25</span> — die untere Grenze wäre\n<span class='formel'>1-1,25=-0,25</span>.<br><i>(c)</i> Eine Wahrscheinlichkeit ist nie negativ: die Ungleichung sagt hier\nschlicht <b>gar nichts</b>. Bei fünf Aufenthalten kann jede Abweichung reiner\nZufall sein. <i>Nicht die Abweichung allein entscheidet, sondern sie zusammen\nmit der Datenmenge — genau wie bei den Erhebungen in A.4.</i></p>"}}}, {"kuerzel": "A.6", "welt": "Musikfestival", "kurz": "Multinomial, Slot-Argumente — der grösste Apparat", "bild": "bilder/Festigung_Festival.png", "kontext": "Neun Bands treten auf drei Bühnen auf — auf jeder Bühne spielen genau drei\n nacheinander. Drei der neun sind Headliner.\n <ul><li><b>(1)</b> jeder Headliner spielt auf seiner Bühne als Letzter</li><li><b>(2)</b> die beiden lautesten Bands spielen auf derselben Bühne</li><li><b>(3)</b> Ihre Lieblingsband spielt auf Bühne A</li></ul>", "kapitel": {"1": {"name": "Zählen", "auftraege": ["Wie viele Spielpläne gibt es überhaupt? Bestimmen Sie das <b>auf zwei\n Wegen</b>. Bestimmen Sie dann alle drei Fallbeispiele und zeichnen Sie jeweils das\n Urnenmodell.", "Zu <b>(2)</b> wurde Folgendes gerechnet. Warum stimmt das nicht?\n <div class=\"fehlerkasten\">«Die zweite der beiden Bands landet auf einer der drei Bühnen, und in einem\n von drei Fällen ist es dieselbe wie bei der ersten. Also <span class='formel'>9!/3=120 960</span>.»</div>", "Welche Strategien aus Ihrem Baukasten haben Sie jeweils verwendet?", "<i>Ihr eigenes Programm.</i> <span class=\"knacknuss\">Knacknuss</span> Sie entscheiden für jede der\n neun Bands, ob Sie hingehen. Wie viele Programme sind möglich? Und wie viele,\n wenn Sie genau zwei oder drei Bands sehen wollen?"], "loesung": "<p><b>Zählen.</b> <span class='formel'>|Ω|=9!=362 880</span>: neun Bands auf neun Slots.\n<i>Zweiter Weg:</i> erst die Zuteilung auf die Bühnen\n<span class='formel'><span class='bruch'><i>9!</i><i>3! 3! 3!</i></span>=1680</span>, dann die Reihenfolge auf jeder Bühne\n<span class='formel'>(3!)<sup>3</sup>=216</span> — zusammen <span class='formel'>1680·216=362 880</span>.<br><i>(1)</i> Die drei Headliner auf die drei Schluss-Slots: <span class='formel'>3!=6</span>; die übrigen sechs\nBands auf die sechs übrigen Slots: <span class='formel'>6!=720</span>. Also <span class='formel'>6·720=4320</span>.<br><i>(2)</i> Die erste der beiden Bands steht irgendwo; für die zweite bleiben <span class='formel'>8</span>\nSlots, davon liegen <span class='formel'>2</span> auf derselben Bühne: <span class='formel'>9!·<span class='bruch'><i>2</i><i>8</i></span>=90 720</span>.<br><i>(3)</i> Drei der neun Slots liegen auf Bühne A: <span class='formel'>9!·<span class='bruch'><i>3</i><i>9</i></span>=120 960</span>.</p>\n<p><i>(b) Diagnose:</i> Nicht die <i>Bühnen</i> sind hier gleich wahrscheinlich,\nsondern die <i>Slots</i>. Ist die erste Band platziert, bleiben <span class='formel'>8</span> freie Slots —\nund nur <span class='formel'>2</span> davon liegen auf ihrer Bühne, nicht <span class='formel'><span class='bruch'><i>1</i><i>3</i></span></span> von allen. Richtig ist\n<span class='formel'><span class='bruch'><i>2</i><i>8</i></span>=<span class='bruch'><i>1</i><i>4</i></span></span>, also <span class='formel'>90 720</span>.</p>\n<p><i>(c)</i> <span class='formel'>|Ω|</span>: Permutation <i>und</i> Multinomialkoeffizient (zwei Wege);\n(1) feste Plätze mal Rest; (2) und (3) Anteil der günstigen Slots.</p>\n<p><i>(d) Knacknuss:</i> Für jede Band ja oder nein — <span class='formel'>2<sup>9</sup>=512</span> Programme<br><i>(Potenzmenge, wie beim Eis S10: sechs Toppings)</i>. Genau zwei oder drei:\n<span class='formel'><span class='binom'><i>9</i><i>2</i></span>+<span class='binom'><i>9</i><i>3</i></span>=36+84=120</span> — »oder« heisst <b>addieren</b><br><i>(Eis S8: zwei oder drei Kugeln)</i>.</p>"}, "2": {"name": "Ergebnismengen", "auftraege": ["Wählen Sie <i>eines</i> der drei Fallbeispiele. Stellen Sie <b>drei\n Ergebnismengen</b> auf: zwei, in denen sich das Fallbeispiel beschreiben lässt, und\n eine gültige, in der es <i>nicht</i> geht. Woran liegt der Unterschied?", "Warum ist die folgende Menge keine gültige Ergebnismenge?\n <div class=\"fehlerkasten\">«Ich notiere, wie viele Bands vor meiner Lieblingsband auf deren Bühne\n spielen: <span class='formel'>Ω={0,1,2,…,8}</span>.»</div>", "Nennen Sie <span class='formel'>H₁</span>, <span class='formel'>H₂</span>, <span class='formel'>H₃</span> die Ereignisse »der erste / zweite / dritte\n Headliner spielt auf seiner Bühne als Letzter«. Schreiben Sie <b>(1)</b> damit\n auf — und ebenso das Gegenereignis, auf <i>zwei</i> Arten. Was fällt beim\n Vergleich auf?"], "loesung": "<p><b>Ergebnismengen.</b><br><i>(a) z. B. zu (3):</i> tauglich »welche Band in welchem Slot« (<span class='formel'>9!</span>) und\n»auf welcher Bühne die Lieblingsband spielt« (<span class='formel'>3</span>); <i>nicht</i> tauglich »welche\nBands auf welcher Bühne« ohne Namen der Lieblingsband.<br><i>(b)</i> <b>Überschuss:</b> Auf einer Bühne spielen nur drei Bands, vor der\neigenen können also höchstens <i>zwei</i> anderen spielen. Die Werte <span class='formel'>3</span> bis <span class='formel'>8</span>\ntreten nie ein.<br><i>(c)</i> <span class='formel'>(1)=H₁∩ H₂∩ H₃</span>. Gegenereignis:\n<span class='formel'><span class='quer'>H₁∩ H₂∩ H₃</span>=<span class='quer'>H₁</span>∪<span class='quer'>H₂</span>∪<span class='quer'>H₃</span></span>\n— »mindestens ein Headliner spielt nicht zuletzt«. <b>De Morgan.</b></p>"}, "3": {"name": "Laplace", "auftraege": ["Nehmen Sie an, der Spielplan wird <i>ausgelost</i>. Bestimmen Sie die drei\n Wahrscheinlichkeiten — <i>wenn möglich</i> mit <b>zwei verschiedenen\n Ergebnismengen</b>.", "Stellen Sie den Zusammenhang zu Ihren <b>Prüffragen</b> aus der Reflexion\n her: Welche hat bei welchem Fallbeispiel den Ausschlag gegeben?", "Entlarven Sie den Fehler.\n <div class=\"fehlerkasten\">«Jeder Headliner spielt auf seiner Bühne mit Wahrscheinlichkeit\n <span class='formel'><span class='bruch'><i>1</i><i>3</i></span></span> als Letzter. Für alle drei zusammen also\n <span class='formel'>(<span class='bruch'><i>1</i><i>3</i></span>)<sup>3</sup>=<span class='bruch'><i>1</i><i>27</i></span></span>.»</div>"], "loesung": "<p><b>Laplace.</b> Jeder der <span class='formel'>9!</span> Spielpläne ist gleich wahrscheinlich.<br><i>(a)</i> <span class='formel'>P(1)=<span class='bruch'><i>4320</i><i>362 880</i></span>=<span class='bruch'><i>1</i><i>84</i></span></span>;\n<span class='formel'>P(2)=<span class='bruch'><i>90 720</i><i>362 880</i></span>=<span class='bruch'><i>1</i><i>4</i></span></span>;\n<span class='formel'>P(3)=<span class='bruch'><i>120 960</i><i>362 880</i></span>=<span class='bruch'><i>1</i><i>3</i></span></span> — <i>und</i> auf der groben Menge\n»Bühne der Lieblingsband« ebenfalls <span class='formel'><span class='bruch'><i>1</i><i>3</i></span></span>: zwei Ergebnismengen, gleiches\nErgebnis.<br><i>(b)</i> Nur bei (3) trägt eine gröbere Menge — die drei Bühnen sind für eine\neinzelne Band gleich wahrscheinlich. (1) und (2) brauchen die feine Menge.<br><i>(c) Diagnose:</i> Die drei Ereignisse sind <i>nicht</i> unabhängig — steht ein\nHeadliner am Schluss seiner Bühne, ändert das die Aussichten der anderen. Richtig:\n<span class='formel'><span class='bruch'><i>3!·6!</i><i>9!</i></span>=<span class='bruch'><i>1</i><i>84</i></span>≈0,012</span>, nicht <span class='formel'><span class='bruch'><i>1</i><i>27</i></span>≈0,037</span>.</p>"}, "4": {"name": "Daten", "auftraege": ["Wie weit weicht das von dem ab, was bei gleichmässiger Verteilung zu\n erwarten wäre?", "Trägt die Behauptung? Nutzen Sie die Ungleichung aus Kapitel 4.", "Wie viele Auftritte bräuchte es, damit Sie sich sicher wären?"], "loesung": "<p><b>Daten.</b><br><i>(a)</i> Erwartet <span class='formel'><span class='bruch'><i>1</i><i>3</i></span>≈0,333</span>, gemessen\n<span class='formel'><span class='bruch'><i>52</i><i>120</i></span>≈0,433</span> — Abweichung <span class='formel'>d≈0,100</span>.<br><i>(b)</i> <span class='formel'><span class='bruch'><i>1</i><i>4·120·0,100<sup>2</sup></i></span>≈0,21</span>: bis zu <span class='formel'>21 %</span>\nWahrscheinlichkeit, auch bei gleichmässiger Verteilung — <b>die Behauptung\nträgt nicht</b>.<br><i>(c)</i> Für eine Schranke unter <span class='formel'>5 %</span> braucht es rund <span class='formel'>500</span> Auftritte.</p>"}}}], "kapitel": [{"nr": 1, "name": "Zählen", "farbe": "aktion", "hex": "#9867A5"}, {"nr": 2, "name": "Ergebnismengen", "farbe": "zugang", "hex": "#007D57"}, {"nr": 3, "name": "Laplace", "farbe": "beweis", "hex": "#E09E5A"}, {"nr": 4, "name": "Daten", "farbe": "fach", "hex": "#0065A9"}]};
let stand = {welt: 0, kapitel: 1};

function farbe(nr){
  const k = D.kapitel.find(x => x.nr === nr);
  return k ? k.hex : '#9867A5';
}

/* Die Landkarte. Sie steht immer da - das ist die Entscheidung aus der
   Arbeitsliste: «Man sieht sonst nicht, wo man steht, und die Matrix ist
   gerade der Witz an der Sache.» */
function matrix(){
  const t = document.getElementById('matrix');
  // ENTSCHEIDUNG (2026-08-21, nach Rikes Rueckmeldung): Der Kopf traegt
  // nur noch die Kapitelzahl, nicht mehr den Namen. Zwei Gruende, beide
  // von Rike: «Ergebnismengen» ist viel laenger als «Daten» und zieht
  // die Spalte breit, obwohl alle vier gleich viel wiegen - und die
  // Namen stehen ohnehin auf jeder Aufgabenseite. Verworfen: den Kopf
  // ganz weglassen. Dann steht ueber der ersten Spalte nichts, und die
  // Zahlen in den Zellen muessten allein die Ordnung tragen.
  let h = '<tr><th></th>' + D.kapitel.map(k =>
      `<th style="color:${k.hex}" title="${k.name}">${k.nr}</th>`).join('') + '</tr>';
  D.welten.forEach((w, i) => {
    h += `<tr><th class="welt">`
       + (w.bild ? `<img class="weltbild" src="${w.bild}" alt="">` : '')
       + `${w.welt}</th>`;
    D.kapitel.forEach(k => {
      const da = !!w.kapitel[k.nr];
      const hier = (i === stand.welt && k.nr === stand.kapitel);
      h += `<td><button class="zelle" data-w="${i}" data-k="${k.nr}"
              aria-current="${hier}"
              style="border-color:${k.hex};${hier ? 'background:' + k.hex : ''}"
              ${da ? '' : 'disabled'}>${da ? k.nr : '—'}</button></td>`;
    });
    h += '</tr>';
  });
  t.innerHTML = h;
  t.querySelectorAll('.zelle').forEach(b => b.onclick = () => {
    stand.welt = +b.dataset.w; stand.kapitel = +b.dataset.k; zeigen();
  });
}

function zeigen(){
  const w = D.welten[stand.welt];
  const k = w.kapitel[stand.kapitel];
  const kap = D.kapitel.find(x => x.nr === stand.kapitel);
  document.documentElement.style.setProperty('--akzent', kap.hex);
  // Derselbe Ton, stark aufgehellt - Grund fuer den Fehlerkasten.
  document.documentElement.style.setProperty('--akzentblass', kap.hex + '14');
  document.getElementById('streifen').style.background = kap.hex;
  document.getElementById('wostehe').textContent =
    `${w.welt} · Kapitel ${kap.nr} — ${kap.name}`;

  const a = document.getElementById('aufgabe');
  if (!k){ a.innerHTML = '<p>Zu diesem Feld gibt es noch keine Aufgabe.</p>';
           matrix(); return; }

  a.innerHTML = `
    <div class="kopfzeile">
      ${w.bild ? `<img src="${w.bild}" alt="">` : ''}
      <div>
        <p class="welt">${w.welt}</p>
        <p class="kurz">${w.kurz}</p>
        <div class="kontext">${w.kontext}</div>
      </div>
    </div>
    <div class="schwerpunkt">
      <span class="nr">${kap.nr}</span>
      <h3>${k.name}</h3>
    </div>
    <ol class="auftraege" type="a">
      ${k.auftraege.map(x => `<li>${x}</li>`).join('')}
    </ol>
    <div class="loesung" id="loesung">
      <button id="loesungknopf">Lösung zeigen</button>
      <div class="inhalt">${k.loesung
        ? k.loesung
        : '<span class="fehlt">Zu dieser Aufgabe ist noch keine Lösung '
          + 'geschrieben. Im Skript steht an ihrer Stelle bisher nur ein '
          + 'Vermerk.</span>'}</div>
    </div>
    <div class="weiter" id="weiter"></div>`;

  document.getElementById('loesungknopf').onclick = () => {
    const l = document.getElementById('loesung');
    l.classList.toggle('offen');
    document.getElementById('loesungknopf').textContent =
      l.classList.contains('offen') ? 'Lösung verbergen' : 'Lösung zeigen';
  };

  /* Zwei Wege durch die Matrix - nach rechts oder nach unten. Sie sind
     Knoepfe UND in der Landkarte sichtbar; wer lieber springt, klickt
     dort. Blindes Verzweigen gibt es nicht. */
  const weiter = document.getElementById('weiter');
  const rechts = D.kapitel.find(x => x.nr === stand.kapitel + 1);
  const unten = D.welten[stand.welt + 1];
  let h = '';
  if (rechts && w.kapitel[rechts.nr])
    h += `<button data-w="${stand.welt}" data-k="${rechts.nr}">`
       + `<b>nach rechts — dieselbe Welt, nächstes Kapitel</b>`
       + `${w.welt} · ${rechts.nr} ${rechts.name}</button>`;
  if (unten && unten.kapitel[stand.kapitel])
    h += `<button data-w="${stand.welt + 1}" data-k="${stand.kapitel}">`
       + `<b>nach unten — dasselbe Kapitel, andere Welt</b>`
       + `${unten.welt} · ${kap.nr} ${kap.name}</button>`;
  weiter.innerHTML = h || '<span class="kurz">Hier endet die Matrix. '
                        + 'Über die Landkarte geht es weiter.</span>';
  weiter.querySelectorAll('button').forEach(b => b.onclick = () => {
    stand.welt = +b.dataset.w; stand.kapitel = +b.dataset.k; zeigen();
    document.getElementById('aufgabe').scrollTop = 0;
  });

  matrix();
}

matrix(); zeigen();
</script>
</body></html>
