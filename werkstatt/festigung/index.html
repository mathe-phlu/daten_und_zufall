<script>
const D = {"welten": [{"kuerzel": "A.1", "welt": "Würfel", "kurz": "vertraut, kleine Zahlen — und die Referenzwelt", "bild": "bilder/Festigung_Wuerfel.png", "kontext": "Drei Würfel werden geworfen.\n <ul><li><b>(1)</b> mindestens eine gerade Augenzahl</li><li><b>(2)</b> mindestens eine Sechs</li><li><b>(3)</b> genau zwei zeigen dieselbe Zahl</li></ul>", "kapitel": {"1": {"name": "Zählen", "einleitung": "", "auftraege": ["Bestimmen Sie für alle drei die Anzahl der Möglichkeiten — wo möglich <b>auf zwei Wegen</b> — und zeichnen Sie jeweils das Urnenmodell.", "Zu <b>(3)</b> wurde Folgendes gerechnet. Warum stimmt das nicht?\n <div class=\"fehlerkasten\">«Augenzahl des Paars: <span class='formel'>6</span>. Dritte Zahl: <span class='formel'>6</span>. Stelle der dritten: <span class='formel'>3</span>.\n Also <span class='formel'>6·3·6=108</span>.»</div>", "Welche Strategien aus Ihrem Baukasten haben Sie jeweils verwendet?", "<i>Drei gleiche Würfel.</i> <span class=\"knacknuss\">Knacknuss</span> Die drei Würfel sind nicht zu\n unterscheiden — es zählt nur, welche Augenzahlen liegen, nicht welcher Würfel\n welche zeigt. Wie viele Ergebnisse gibt es dann?"], "loesung": "<p><b>Zählen.</b><br><i>(a)</i> <i>Urnenmodell:</i> eine Urne mit den Kugeln <span class='formel'>1</span>\nbis <span class='formel'>6</span>, dreimal ziehen <i>mit</i> Zurücklegen und <i>mit</i> Reihenfolge (erster,\nzweiter, dritter Würfel): <span class='formel'>|Ω|=6<sup>3</sup>=216</span>. Für das Gegenstück zu (1) liegen nur\ndie ungeraden Kugeln <span class='formel'>1,3,5</span> in der Urne, für das zu (2) nur <span class='formel'>1</span> bis <span class='formel'>5</span>.<br><i>(1)</i> <span class='formel'>216-3<sup>3</sup>=189</span>; Fallsumme <span class='formel'>81+81+27</span>.<br><i>(2)</i> <span class='formel'>216-5<sup>3</sup>=91</span>; Fallsumme <span class='formel'>75+15+1</span>.<br><i>(3)</i> <span class='formel'>6·5·3=90</span>; oder <span class='formel'>216-6-120=90</span>.</p>\n<p><i>(b) Diagnose:</i> Das zweite <span class='formel'>· 6</span> lässt die dritte Zahl <i>beliebig</i> —\nalso auch gleich der Paarzahl. Damit rutschen die <span class='formel'>6</span> Drillinge hinein, und jedes\nPaar wird doppelt gezählt (einmal als «Paar <span class='formel'>a</span>, dritte <span class='formel'>b</span>», einmal als «Paar <span class='formel'>b</span>,\ndritte <span class='formel'>a</span>»). Richtig ist <i>anders</i> statt <i>beliebig</i>: <span class='formel'>6·5·3=90</span>.</p>\n<p><i>(c)</i> (1)/(2) Komplement bzw. Fallsumme; (3) Fallunterscheidung mit Position.</p>\n<p><i>(d) Knacknuss:</i> Jetzt zählt nur noch, <i>welche</i> Augenzahlen liegen —\nmit Wiederholung, ohne Reihenfolge. Plus-und-Balken: <span class='formel'><span class='binom'><i>6+3-1</i><i>3</i></span>=<span class='binom'><i>8</i><i>3</i></span>=56</span>.\n<i>Dieselbe Strategie wie bei Eis 4 (drei Kugeln in den Becher, Sorten dürfen\nsich wiederholen).</i></p>"}, "2": {"name": "Ergebnismengen", "einleitung": "", "auftraege": ["Wählen Sie <i>eines</i> der drei Fallbeispiele. Stellen Sie <b>drei Ergebnismengen</b> auf: zwei, in denen sich das Fallbeispiel beschreiben lässt, und\n eine gültige, in der es <i>nicht</i> geht. Woran liegt der Unterschied?", "Warum ist die folgende Menge keine gültige Ergebnismenge für den Wurf mit\n drei Würfeln? <i>(Es gibt zwei Gründe.)</i>\n <div class=\"fehlerkasten\">«Ich nehme die Augensumme: <span class='formel'>Ω={2,3,4,…,12}</span>.»</div>", "Nennen Sie <span class='formel'>G₁</span>, <span class='formel'>G₂</span>, <span class='formel'>G₃</span> die Ereignisse »der erste / zweite / dritte\n Würfel zeigt eine gerade Zahl«. Schreiben Sie damit <b>Fallbeispiel (1)</b>\n auf — und ebenso sein Gegenereignis, auf <i>zwei</i> Arten. Was fällt beim\n Vergleich auf? Zeichnen Sie dazu ein Venn-Diagramm."], "loesung": "<p><b>Ergebnismengen.</b><br><i>(a) z. B. zu (2):</i> tauglich das <i>Augentripel</i> (<span class='formel'>216</span>) und »<i>Sechs\nja/nein</i> pro Würfel« (<span class='formel'>8</span>); <i>nicht beschreibbar</i> in der <i>Augensumme</i>\n— Summe <span class='formel'>12</span> entsteht mit (<span class='formel'>6+5+1</span>) und ohne (<span class='formel'>4+4+4</span>) Sechs. Die\nAugensumme verrät also nicht, ob eine Sechs gefallen ist.</p>\n<p><i>(b) Zwei Mängel:</i> <i>Überschuss</i> — die <span class='formel'>2</span> tritt nie ein (Minimum <span class='formel'>3</span>);\n<i>Lücke</i> — <span class='formel'>13</span> bis <span class='formel'>18</span> fehlen. Eine Ergebnismenge muss genau die Ergebnisse\nenthalten, die eintreten können: keine Lücken, kein Überschuss.</p>\n<p><i>(c) Ereignisalgebra.</i><br><i>(1)</i> <span class='formel'>=G₁∪ G₂∪ G₃</span> (<span class='formel'>189</span>).\n<i>Gegenereignis »keine gerade«</i>, erste Art: <span class='formel'><span class='quer'>G₁∪ G₂∪ G₃</span></span>\n— »nicht mindestens eine gerade«. Zweite Art:\n<span class='formel'><span class='quer'>G₁</span>∩<span class='quer'>G₂</span>∩<span class='quer'>G₃</span></span> — »alle drei ungerade«\n(<span class='formel'>3<sup>3</sup>=27</span>).\n<i>Beim Vergleich:</i> Beide Wege führen im Venn zum selben Feld, dem Feld\nausserhalb aller drei Kreise. Das ist <b>De Morgan</b>, am Bild ablesbar.</p>"}, "3": {"name": "Laplace", "einleitung": "", "auftraege": ["Bestimmen Sie die drei Wahrscheinlichkeiten — <i>wenn möglich</i> mit\n <b>zwei verschiedenen Ergebnismengen</b>.", "Stellen Sie den Zusammenhang zu Ihren <b>Prüffragen</b> aus der Reflexion\n her: Welche hat bei welchem Fallbeispiel den Ausschlag gegeben?", "Entlarven Sie den Fehler.\n <div class=\"fehlerkasten\">«Pro Würfel: Sechs oder nicht. Das sind <span class='formel'>2<sup>3</sup>=8</span> Muster, <span class='formel'>7</span> davon mit einer\n Sechs. Also <span class='formel'>P=<span class='bruch'><i>7</i><i>8</i></span></span>.»</div>"], "loesung": "<p><b>Wahrscheinlichkeit.</b><br><i>(a)</i> (1) <span class='formel'>=<span class='bruch'><i>189</i><i>216</i></span>=<span class='bruch'><i>7</i><i>8</i></span></span> — auf dem Augentripel <i>und</i> auf dem\ngerade/ungerade-Muster (<span class='formel'>7</span> von <span class='formel'>8</span> Feldern, je <span class='formel'><span class='bruch'><i>1</i><i>8</i></span></span>): zwei Ergebnismengen,\ngleiches Ergebnis. (2) <span class='formel'>=<span class='bruch'><i>91</i><i>216</i></span></span>, (3) <span class='formel'>=<span class='bruch'><i>90</i><i>216</i></span>=<span class='bruch'><i>5</i><i>12</i></span></span> —\nje nur auf dem Augentripel.</p>\n<p><i>(b)</i> Den Ausschlag gibt die Frage, ob eine gröbere Einteilung in\n<i>gleich wahrscheinliche</i> Teile zerfällt.<br><i>(1)</i> Ja: gerade/ungerade steht <span class='formel'>3:3</span>, jedes Muster hat <span class='formel'><span class='bruch'><i>1</i><i>8</i></span></span> — darum\ngelingen zwei Ergebnismengen.<br><i>(2)</i> Nein: »Sechs ja/nein« steht <span class='formel'>1:5</span>. Auch <i>ohne Reihenfolge</i> hilft\nnicht: Die <span class='formel'>56</span> Ergebnisse gleicher Würfel sind nicht gleich wahrscheinlich —\n<span class='formel'>{6,6,6}</span> fällt auf eine Art, <span class='formel'>{1,2,6}</span> auf sechs.<br><i>(3)</i> Nein: Ohne Reihenfolge wie bei (2), und das Muster »alle gleich / genau\nzwei gleich / alle verschieden« wiegt <span class='formel'>6:90:120</span>. Es bleibt das Augentripel.</p>\n<p><i>(c) Diagnose:</i> Die <span class='formel'>8</span> Muster sind <i>nicht</i> gleich wahrscheinlich — »Sechs«\nhat <span class='formel'><span class='bruch'><i>1</i><i>6</i></span></span>, »keine Sechs« <span class='formel'><span class='bruch'><i>5</i><i>6</i></span></span>. Man darf nur zählen statt rechnen, wenn alle\nFälle gleich wiegen. Richtig: <span class='formel'><span class='bruch'><i>91</i><i>216</i></span>≈0,42</span> — nicht <span class='formel'><span class='bruch'><i>7</i><i>8</i></span></span>.</p>"}, "4": {"name": "Daten", "einleitung": "In einer Klasse werfen alle immer wieder drei Würfel und zählen, wie oft\n<b>(2)</b> eintritt — mindestens eine Sechs. Gruppe A: <span class='formel'>14</span>-mal in\n<b>24 Würfen</b>. Gruppe B: <span class='formel'>49</span>-mal in <b>120 Würfen</b>. Die ganze Klasse\nzusammen: <span class='formel'>508</span>-mal in <b>1200 Würfen</b>.", "auftraege": ["Bestimmen Sie die drei relativen Häufigkeiten und vergleichen Sie sie mit\n Ihrem Ergebnis aus dem letzten Block. Welcher der drei Zahlen trauen Sie am\n meisten — und warum?", "Gruppe A hat folgenden Schluss gezogen. Warum trägt er nicht?\n <div class=\"fehlerkasten\">«Bei uns kam in <span class='formel'>14</span> von <span class='formel'>24</span> Würfen mindestens eine Sechs, das sind\n über <span class='formel'>58 %</span>. Die <span class='formel'><span class='bruch'><i>91</i><i>216</i></span></span> aus der Laplace-Rechnung sind damit\n widerlegt.»</div>", "Jetzt werden statt der Würfel <b>drei Reisszwecken</b> geworfen, und\n gefragt ist: Mindestens eine landet mit der Spitze nach oben. Welcher Weg trägt\n jetzt noch — der aus dem letzten Block oder der über die Zählungen der Klasse?\n Woran liegt es?"], "loesung": "<p><b>Daten.</b><br><i>(a)</i> <span class='formel'>h₂₄=<span class='bruch'><i>14</i><i>24</i></span>≈0,583</span>, <span class='formel'>h₁₂₀=<span class='bruch'><i>49</i><i>120</i></span>≈\n0,408</span>, <span class='formel'>h₁₂₀₀=<span class='bruch'><i>508</i><i>1200</i></span>≈0,423</span>; der Laplace-Wert ist\n<span class='formel'><span class='bruch'><i>91</i><i>216</i></span>≈0,421</span>. Am meisten trägt die ganze Klasse: Je grösser <span class='formel'>n</span>,\ndesto weniger fällt ein einzelner Wurf ins Gewicht — die relativen Häufigkeiten\npendeln sich ein (<i>empirisches Gesetz der grossen Zahlen</i>).<br><i>(b) Diagnose:</i> <span class='formel'>h₂₄</span> ist ein <i>Schätzwert</i>, und bei <span class='formel'>24</span> Würfen ein\ngrober. Er schwankt von Gruppe zu Gruppe; Gruppe B liegt mit fast fünfmal so vielen\nWürfen schon darunter. Daten können ein Modell stützen oder in Zweifel ziehen —\naus <span class='formel'>24</span> Würfen folgt weder das eine noch das andere.<br><i>(c)</i> Der Laplace-Weg trägt nicht mehr: Spitze oben und Spitze seitlich sind\n<i>nicht</i> gleich wahrscheinlich — derselbe Fehler wie beim »Sechs ja/nein«-Muster\nim letzten Block. Es bleibt nur der statistische Weg: oft werfen, die relative\nHäufigkeit bestimmen. <i>Genau dafür braucht es den zweiten\nWahrscheinlichkeitsbegriff.</i></p>"}}}, {"kuerzel": "A.2", "welt": "Bewerbung", "kurz": "Auswahl, Binomialkoeffizient, genau k", "bild": "bilder/Festigung_Bewerbung.png", "kontext": "Auf eine Stelle bewerben sich 10 Personen: 3 Frauen (Keller, Lang,\n Meier) und 7 Männer. Vier werden zum Gespräch eingeladen.\n <ul><li><b>(1)</b> mindestens eine Frau ist dabei</li><li><b>(2)</b> genau zwei Frauen sind dabei</li><li><b>(3)</b> Frau Keller ist dabei</li></ul>", "kapitel": {"1": {"name": "Zählen", "einleitung": "", "auftraege": ["Bestimmen Sie für alle drei die Anzahl der Möglichkeiten — wo möglich <b>auf zwei Wegen</b> — und zeichnen Sie jeweils das Urnenmodell.", "Zu <b>(2)</b> wurde Folgendes gerechnet. Warum stimmt das nicht?\n <div class=\"fehlerkasten\">«Die erste Frau: <span class='formel'>3</span>, die zweite: <span class='formel'>2</span>. Der erste Mann: <span class='formel'>7</span>, der zweite: <span class='formel'>6</span>.\n Also <span class='formel'>3·2·7·6=252</span>.»</div>", "Welche Strategien aus Ihrem Baukasten haben Sie jeweils verwendet?", "<i>Alle zehn im Gespräch.</i> <span class=\"knacknuss\">Knacknuss</span> Statt vier einzuladen werden alle\n zehn auf drei <i>gleichzeitige</i> Gespräche verteilt: eines mit vier Personen,\n zwei mit je drei. Wie viele Aufteilungen gibt es?"], "loesung": "<p><b>Zählen.</b><br><i>(a)</i> <i>Urnenmodell:</i> zehn Kugeln, drei für die\nFrauen, sieben für die Männer; vier ziehen <i>ohne</i> Zurücklegen und <i>ohne</i>\nReihenfolge: <span class='formel'>|Ω|=<span class='binom'><i>10</i><i>4</i></span>=210</span>. Für (2) zwei Urnen — zwei Kugeln aus\nder Frauen-, zwei aus der Männerurne. Für (3) liegt die Kugel »Keller« schon\ndraussen, drei werden aus den übrigen neun gezogen.<br><i>(1)</i> <span class='formel'>210-<span class='binom'><i>7</i><i>4</i></span>=175</span>; Fallsumme <span class='formel'>105+63+7</span>.<br><i>(2)</i> <span class='formel'><span class='binom'><i>3</i><i>2</i></span><span class='binom'><i>7</i><i>2</i></span>=3·21=63</span>.<br><i>(3)</i> <span class='formel'><span class='binom'><i>9</i><i>3</i></span>=84</span> (Keller fest, drei aus den übrigen neun).</p>\n<p><i>(b) Diagnose:</i> Die Auswahl ist <i>ungeordnet</i> — »erste/zweite Frau« gibt es\nnicht. <span class='formel'>3·2</span> zählt jedes Frauenpaar zweimal, <span class='formel'>7·6</span> jedes Männerpaar zweimal;\n<span class='formel'>252=63·4</span>. Richtig: <span class='formel'><span class='binom'><i>3</i><i>2</i></span><span class='binom'><i>7</i><i>2</i></span>=63</span>.</p>\n<p><i>(c)</i> (1) Komplement/Fallsumme; (2) genau-<span class='formel'>k</span> als Produkt zweier Auswahlen;\n(3) ein Element fixieren.<br><i>(d) Alle zehn im Gespräch:</i> <span class='formel'><span class='binom'><i>10</i><i>4</i></span><span class='binom'><i>6</i><i>3</i></span><span class='binom'><i>3</i><i>3</i></span>=210·20·1=4200</span>\n— darin ist aber jede Aufteilung <i>zweimal</i> gezählt, weil die Gespräche\ngleichzeitig stattfinden und die beiden Dreiergruppen damit vertauschbar sind:\n<span class='formel'>4200/2!=2100</span>. <i>Dieselbe Strategie wie bei Eis 16 (drei gleiche\nBecher) und beim Hotel (identische Bungalows): sind die Behälter gleichartig, teilt\nman durch ihre Vertauschungen.</i></p>"}, "2": {"name": "Ergebnismengen", "einleitung": "", "auftraege": ["Wählen Sie <i>eines</i> der drei Fallbeispiele und stellen Sie <b>drei Ergebnismengen</b> auf: zwei, die es beschreiben, und eine gültige, die dafür\n <i>zu grob</i> ist. Woran erkennen Sie »zu grob«?", "Warum ist das keine gültige Ergebnismenge?\n <div class=\"fehlerkasten\">«Ich notiere, was für eine Runde es wird:\n <span class='formel'>Ω={</span>reine Männerrunde, reine Frauenrunde<span class='formel'>}</span>.»</div>", "Nennen Sie <span class='formel'>K</span>, <span class='formel'>L</span>, <span class='formel'>M</span> die Ereignisse »Frau Keller / Lang / Meier ist\n dabei«. Zeichnen Sie das Venn und verorten Sie darin die drei Fallbeispiele.\n Welche davon lassen sich mit <span class='formel'>K</span>, <span class='formel'>L</span> und <span class='formel'>M</span> auch <i>aufschreiben</i>? Und:\n Lesen Sie am Bild ab, warum <span class='formel'>|K|+|L|+|M|</span> nicht die Antwort auf (1) ist."], "loesung": "<p><b>Ergebnismengen.</b><br><i>(a) z. B. zu (3):</i> tauglich »welche vier Personen« (<span class='formel'>210</span>) und »welche Frauen\nsind dabei« (<span class='formel'>8</span>); <i>zu grob</i> »Anzahl der Frauen« — sie sagt nicht, <i>welche</i>.<br><i>(b)</i> <b>Lücke:</b> Die allermeisten Runden sind <i>gemischt</i> und haben gar\nkein Notat. Eine Ergebnismenge muss jedes mögliche Ergebnis erfassen — genau eines.<br><i>(c)</i> <span class='formel'>(1)=K∪ L∪ M</span>, <span class='formel'>(3)=K</span>, <span class='formel'>(2)=</span> die drei Felder »genau zwei der drei«.\n»keine Frau« <span class='formel'>=<span class='quer'>K∪ L∪ M</span>=<span class='quer'>K</span>∩<span class='quer'>L</span>∩<span class='quer'>M</span>=35</span>\n— <b>De Morgan</b>. <span class='formel'>|K|+|L|+|M|=3·84=252</span> zählt die Überschneidungen mehrfach;\n<b>Inklusion-Exklusion:</b> <span class='formel'>252-3·28+7=175</span> (<span class='formel'>|K∩ L|=<span class='binom'><i>8</i><i>2</i></span>=28</span>,\n<span class='formel'>|K∩ L∩ M|=<span class='binom'><i>7</i><i>1</i></span>=7</span>).</p>"}, "3": {"name": "Laplace", "einleitung": "", "auftraege": ["Nehmen Sie an, die vier Eingeladenen werden <i>ausgelost</i>. Bestimmen Sie\n die drei Wahrscheinlichkeiten — <i>wenn möglich</i> mit <b>zwei\n verschiedenen Ergebnismengen</b>.", "Stellen Sie den Zusammenhang zu Ihren <b>Prüffragen</b> aus der Reflexion\n her: Welche hat bei welchem Fallbeispiel den Ausschlag gegeben?", "Entlarven Sie den Fehler.\n <div class=\"fehlerkasten\">«Es sind <span class='formel'>0</span>, <span class='formel'>1</span>, <span class='formel'>2</span> oder <span class='formel'>3</span> Frauen dabei — vier Fälle, drei davon mit\n mindestens einer Frau. Also <span class='formel'>P=<span class='bruch'><i>3</i><i>4</i></span></span>.»</div>"], "loesung": "<p><b>Wahrscheinlichkeit.</b><br><i>(a)</i> <span class='formel'>P(1)=<span class='bruch'><i>175</i><i>210</i></span>=<span class='bruch'><i>5</i><i>6</i></span></span>, <span class='formel'>P(2)=<span class='bruch'><i>63</i><i>210</i></span>=<span class='bruch'><i>3</i><i>10</i></span></span>,\n<span class='formel'>P(3)=<span class='bruch'><i>84</i><i>210</i></span>=<span class='bruch'><i>2</i><i>5</i></span></span>. Zweite Ergebnismenge: die <i>geordnete</i> Auswahl\n(<span class='formel'>10·9·8·7=5040</span>), z. B. <span class='formel'>P(1)=<span class='bruch'><i>5040-840</i><i>5040</i></span>=<span class='bruch'><i>5</i><i>6</i></span></span> —\nauch sie ist Laplace, also gleiches Ergebnis.<br><i>(b)</i> <i>Ohne Reihenfolge?</i> Hier geht es mit und ohne: geordnete und\nungeordnete Auswahl sind beide Laplace, darum gelingen bei allen drei\nFallbeispielen zwei Wege.\n<i>Gröbere Einteilung?</i> »Anzahl der Frauen« ist gültig, aber <b>nicht\nLaplace</b>: die vier Werte wiegen <span class='formel'>35</span>, <span class='formel'>105</span>, <span class='formel'>63</span>, <span class='formel'>7</span> — die Kategorie steht\n<span class='formel'>3:7</span>. Zählen statt rechnen darf man nur, wenn alle Fälle gleich wiegen.<br><i>(c) Diagnose:</i> genau dieser Fehler. Die vier Fälle sind nicht gleich\nwahrscheinlich; <span class='formel'><span class='bruch'><i>3</i><i>4</i></span>=0,75</span> statt <span class='formel'><span class='bruch'><i>5</i><i>6</i></span>≈0,83</span>.</p>"}, "4": {"name": "Daten", "einleitung": "Die Personalabteilung hat <b>200 Gesprächsrunden</b> dieser Art ausgewertet —\nimmer vier aus zehn, darunter dieselben drei Frauen. Frau Keller war <span class='formel'>84</span>-mal\ndabei, Frau Lang <span class='formel'>78</span>-mal, Frau Meier <span class='formel'>80</span>-mal, Keller und Lang zusammen <span class='formel'>30</span>-mal.", "auftraege": ["Wie oft war Frau Keller <i>oder</i> Frau Lang dabei — und wie oft keine der\n beiden? Geben Sie relative Häufigkeiten an und vergleichen Sie mit dem, was die\n Auslosung im letzten Block ergäbe.", "Warum ist dieser Einwand falsch?\n <div class=\"fehlerkasten\">«Keller <span class='formel'>42 %</span>, Lang <span class='formel'>39 %</span>, Meier <span class='formel'>40 %</span> — zusammen <span class='formel'>121 %</span>.\n Mehr als <span class='formel'>100 %</span> geht nicht, die Statistik ist fehlerhaft.»</div>", "Ein zweiter Bericht meldet: In <span class='formel'>70 %</span> der Runden war mindestens eine Frau\n dabei, in <span class='formel'>72 %</span> Frau Keller oder Frau Lang. Kann das stimmen? Begründen Sie\n mit einer Folgerung aus den Axiomen."], "loesung": "<p><b>Daten.</b><br><i>(a)</i> Additionsregel: <span class='formel'>h(K∪ L)=0,42+0,39-0,15=0,66</span>; keine der\nbeiden: <span class='formel'>1-0,66=0,34</span>. Unter Auslosung: <span class='formel'>P(K∪ L)=<span class='bruch'><i>2</i><i>5</i></span>+<span class='bruch'><i>2</i><i>5</i></span>-\n<span class='bruch'><i>2</i><i>15</i></span>=<span class='bruch'><i>2</i><i>3</i></span>≈0,667</span> — die Daten passen gut zum Modell.<br><i>(b) Diagnose:</i> Addieren darf man nur bei <i>disjunkten</i> Ereignissen (K3).\n<span class='formel'>K</span>, <span class='formel'>L</span> und <span class='formel'>M</span> überlappen — es sind oft zwei oder drei Frauen in derselben Runde.\nSchon die Auslosung ergibt <span class='formel'>3·40 %=120 %</span>. Dasselbe Bild wie im Venn\naus dem zweiten Block: <span class='formel'>|K|+|L|+|M|</span> zählt die Überschneidungen mehrfach.<br><i>(c)</i> Nein. <span class='formel'>K∪ L</span> ist ein Teil von »mindestens eine Frau«; nach dem\n<b>Monotoniegesetz</b> kann es nicht häufiger sein. Mindestens eine Frau müsste\nin mindestens <span class='formel'>72 %</span> der Runden dabei gewesen sein.<br>(b) und (c) zusammen:\nEine Summe über <span class='formel'>100 %</span> ist kein Widerspruch — ein Teil, der grösser ist als\ndas Ganze, schon.</p>"}}}, {"kuerzel": "A.3", "welt": "Restaurant", "kurz": "Verkettung anschaulich, Plus-und-Balken als erste Hürde", "bild": "bilder/Festigung_Restaurant.png", "kontext": "Ein Restaurant bietet ein Menü aus drei Gängen an: eine Vorspeise (3 zur Wahl),\n einen Hauptgang (5, darunter ein Fischgericht) und ein Dessert (2). Dazu wählen\n Sie drei Portionen Beilagen aus vier Sorten — dieselbe Sorte darf mehrfach\n vorkommen, und auf dem Teller spielt die Reihenfolge keine Rolle.\n <ul><li><b>(1)</b> der Hauptgang ist das Fischgericht</li><li><b>(2)</b> die drei Beilagen sind alle verschieden</li><li><b>(3)</b> mindestens eine Portion ist Pommes</li></ul>", "kapitel": {"1": {"name": "Zählen", "einleitung": "", "auftraege": ["Wie viele Bestellungen gibt es überhaupt? Bestimmen Sie dann alle drei\n Fallbeispiele — wo möglich <b>auf zwei Wegen</b> — und zeichnen Sie jeweils\n das Urnenmodell.", "Zur <b>Gesamtzahl</b> wurde Folgendes gerechnet. Warum stimmt das nicht?\n <div class=\"fehlerkasten\">«Drei Gänge: <span class='formel'>3·5·2=30</span>. Dann drei Beilagen, für jede vier Sorten:\n <span class='formel'>4<sup>3</sup>=64</span>. Also <span class='formel'>30·64=1920</span>.»</div>", "Welche Strategien aus Ihrem Baukasten haben Sie jeweils verwendet?", "<i>Weniger Gänge.</i> <span class=\"knacknuss\">Knacknuss</span> Vorspeise und Dessert dürfen auch\n weggelassen werden, der Hauptgang ist Pflicht. Wie viele Menüs gibt es dann —\n ohne Beilagen gerechnet? Finden Sie <i>zwei</i> Wege."], "loesung": "<p><b>Zählen.</b><br><i>(a)</i> <i>Urnenmodell:</i> vier Urnen nacheinander. Aus der\nVorspeisen-, der Hauptgang- und der Dessert-Urne (<span class='formel'>3</span>, <span class='formel'>5</span>, <span class='formel'>2</span> Kugeln) je eine\nKugel; dann aus der Beilagen-Urne mit vier Sorten dreimal <i>mit</i> Zurücklegen,\n<i>ohne</i> Reihenfolge (Plus-und-Balken):\n<span class='formel'>|Ω|=(3·5·2 = 30)·\n(<span class='binom'><i>4+3-1</i><i>3</i></span> = 20)=600</span>. Für (1) liegt in der Hauptgang-Urne nur\nder Fisch, für (2) wird <i>ohne</i> Zurücklegen gezogen, für das Gegenstück zu (3)\nfehlen die Pommes in der Beilagen-Urne.<br><i>(1)</i> <span class='formel'>3·1·2·20=120</span>.<br><i>(2)</i> <span class='formel'>30·<span class='binom'><i>4</i><i>3</i></span>=30·4=120</span> — drei verschiedene der vier Sorten.<br><i>(3)</i> Komplement: <span class='formel'>30·(20-<span class='binom'><i>3+3-1</i><i>3</i></span>)=30·(20-10)=300</span>.</p>\n<p><i>(b) Diagnose:</i> <span class='formel'>4<sup>3</sup>=64</span> zählt die Beilagen <i>geordnet</i> — als wäre\n»Pommes, Salat, Salat« etwas anderes als »Salat, Pommes, Salat«. Auf dem Teller\ngibt es keine Reihenfolge. Richtig sind <span class='formel'><span class='binom'><i>6</i><i>3</i></span>=20</span> Zusammenstellungen, also\n<span class='formel'>600</span>.<br>(Teilen liesse sich hier nicht einfach: die <span class='formel'>64</span> verteilen sich\nungleich auf die <span class='formel'>20</span> — genau die Einsicht aus der Reflexion zu Kapitel 3.)</p>\n<p><i>(c)</i> <span class='formel'>|Ω|</span>: Verkettung <i>und</i> Plus-und-Balken; (1) eine Stufe\nfestlegen; (2) Auswahl ohne Wiederholung; (3) Komplement.</p>\n<p><i>(d) Knacknuss:</i> <i>Fälle addieren</i> — drei Gänge <span class='formel'>3·5·2=30</span>, nur\nHauptgang und Dessert <span class='formel'>5·2=10</span>, nur Vorspeise und Hauptgang <span class='formel'>3·5=15</span>, nur\nHauptgang <span class='formel'>5</span>; zusammen <span class='formel'>60</span>.\n<i>Zweiter Weg:</i> »keine Vorspeise« als <i>vierte</i> Möglichkeit mitzählen und\n»kein Dessert« als <i>dritte</i>: <span class='formel'>4·5·3=60</span>. <i>Das Weglassen ist\nselbst eine Wahl — dann wird aus dem Addieren wieder ein Produkt.</i></p>"}, "2": {"name": "Ergebnismengen", "einleitung": "", "auftraege": ["Wählen Sie <i>eines</i> der drei Fallbeispiele. Stellen Sie <b>drei\n Ergebnismengen</b> auf: zwei, in denen sich das Fallbeispiel beschreiben lässt, und\n eine gültige, in der es <i>nicht</i> geht. Woran liegt der Unterschied?", "Warum ist die folgende Menge keine gültige Ergebnismenge?\n <div class=\"fehlerkasten\">«Ich notiere, wie viele verschiedene Beilagensorten auf dem Teller liegen:\n <span class='formel'>Ω={1,2,3,4}</span>.»</div>", "Nennen Sie <span class='formel'>P</span> das Ereignis »mindestens eine Portion Pommes« und <span class='formel'>F</span> das\n Ereignis »der Hauptgang ist Fisch«. Sind <span class='formel'>P</span> und <span class='formel'>F</span> disjunkt? Bestimmen Sie\n <span class='formel'>|P∪ F|</span> auf <i>zwei</i> Arten — direkt und über <span class='formel'>|P|+|F|-|P∩ F|</span>."], "loesung": "<p><b>Ergebnismengen.</b><br><i>(a) z. B. zu (1):</i> tauglich »welche Bestellung« (<span class='formel'>600</span>) und »welcher\nHauptgang« (<span class='formel'>5</span>); <i>nicht</i> tauglich »welche Beilagen« — daraus geht der\nHauptgang nicht hervor.<br><i>(b)</i> <b>Überschuss:</b> Bei drei Portionen können höchstens <i>drei</i>\nverschiedene Sorten auftreten; der Wert <span class='formel'>4</span> tritt nie ein.<br><i>(c)</i> <span class='formel'>P</span> und <span class='formel'>F</span> sind <i>nicht</i> disjunkt — ein Fischgericht mit Pommes\ngibt es sehr wohl. <span class='formel'>|P|=300</span>, <span class='formel'>|F|=120</span>, <span class='formel'>|P∩ F|=3·1·2·10=60</span>\n(Fisch fest, Beilagen mit Pommes). Also <span class='formel'>|P∪ F|=300+120-60=360</span>;\ndirekt: <span class='formel'>600-(240 = <span class='wort'>kein Fisch, keine Pommes</span>)=360</span>.</p>"}, "3": {"name": "Laplace", "einleitung": "", "auftraege": ["Nehmen Sie an, ein Gast bestellt <i>blind</i> — jede Bestellung ist gleich\n wahrscheinlich. Bestimmen Sie die drei Wahrscheinlichkeiten — <i>wenn möglich</i>\n mit <b>zwei verschiedenen Ergebnismengen</b>.", "Stellen Sie den Zusammenhang zu Ihren <b>Prüffragen</b> aus der Reflexion\n her: Welche hat bei welchem Fallbeispiel den Ausschlag gegeben?", "Entlarven Sie den Fehler.\n <div class=\"fehlerkasten\">«Es gibt vier Beilagensorten und drei Portionen. Für jede Portion ist die\n Wahrscheinlichkeit <span class='formel'><span class='bruch'><i>1</i><i>4</i></span></span>, dass es Pommes sind — bei drei Portionen also\n <span class='formel'>3·<span class='bruch'><i>1</i><i>4</i></span>=<span class='bruch'><i>3</i><i>4</i></span></span>.»</div>"], "loesung": "<p><b>Laplace.</b> Jede der <span class='formel'>600</span> Bestellungen ist gleich wahrscheinlich.<br><i>(a)</i> <span class='formel'>P(1)=<span class='bruch'><i>120</i><i>600</i></span>=<span class='bruch'><i>1</i><i>5</i></span></span> — <i>und</i> auf der groben Menge\n»welcher Hauptgang« ebenfalls <span class='formel'><span class='bruch'><i>1</i><i>5</i></span></span>: zwei Ergebnismengen, gleiches Ergebnis.\n<span class='formel'>P(2)=<span class='bruch'><i>120</i><i>600</i></span>=<span class='bruch'><i>1</i><i>5</i></span></span>, <span class='formel'>P(3)=<span class='bruch'><i>300</i><i>600</i></span>=<span class='bruch'><i>1</i><i>2</i></span></span> — beide auch\nauf der groben Menge »welche Beilagen«: <span class='formel'><span class='bruch'><i>4</i><i>20</i></span></span> und <span class='formel'><span class='bruch'><i>10</i><i>20</i></span></span>.<br><i>(b)</i> Den Ausschlag gibt jeweils: <i>Genügt ein Ausschnitt?</i> Für (1) genügt\nder Hauptgang, für (2) und (3) genügen die Beilagen. Der Ausschnitt trägt, weil\njeder seiner Werte gleich viele Bestellungen hinter sich hat — jeder Hauptgang\n<span class='formel'>120</span>, jede Beilagen-Zusammenstellung <span class='formel'>30</span>.<br><i>(c) Diagnose:</i> Die drei Portionen schliessen sich nicht aus — es können\nmehrere Pommes sein. Wahrscheinlichkeiten einfach zu addieren ist nur bei\n<i>disjunkten</i> Ereignissen erlaubt. Richtig: Komplement,\n<span class='formel'>1-<span class='bruch'><i>10</i><i>20</i></span>=<span class='bruch'><i>1</i><i>2</i></span></span>.</p>"}, "4": {"name": "Daten", "einleitung": "Die Kasse des Wirts zeigt für die letzten <b>800 Bestellungen</b>: <span class='formel'>224</span>-mal\nFisch, <span class='formel'>520</span>-mal mindestens eine Portion Pommes, <span class='formel'>168</span>-mal beides.", "auftraege": ["Wie oft wurde Fisch <i>oder</i> Pommes bestellt, wie oft keines von beiden?\n Vergleichen Sie mit Ihren Werten für den blinden Gast aus dem letzten Block.", "Was ist an dieser Überlegung nicht haltbar?\n <div class=\"fehlerkasten\">«Fisch hat <span class='formel'>28 %</span>. Die übrigen vier Hauptgänge teilen sich den Rest,\n also hat jeder <span class='formel'>18 %</span>.»</div>", "Was ist denn nun »die« Wahrscheinlichkeit, dass Fisch bestellt wird —\n <span class='formel'><span class='bruch'><i>1</i><i>5</i></span></span> oder <span class='formel'>0,28</span>? Welche Frage beantwortet welche Zahl, und welche\n braucht der Wirt für seinen Einkauf?"], "loesung": "<p><b>Daten.</b><br><i>(a)</i> <span class='formel'>h(F)=0,28</span>, <span class='formel'>h(P)=0,65</span>, <span class='formel'>h(F∩ P)=0,21</span>;\n<span class='formel'>h(F∪ P)=0,28+0,65-0,21=0,72</span>, keines von beiden <span class='formel'>0,28</span>. Beim blinden\nGast: <span class='formel'>P(F∪ P)=<span class='bruch'><i>1</i><i>5</i></span>+<span class='bruch'><i>1</i><i>2</i></span>-<span class='bruch'><i>1</i><i>10</i></span>=0,6</span>. Echte Gäste bestellen\ndeutlich häufiger Fisch oder Pommes.<br><i>(b) Diagnose:</i> Die Axiome verlangen nur, dass die vier übrigen Gerichte\n<i>zusammen</i> <span class='formel'>72 %</span> ergeben (K2, K3). <i>Wie</i> sich das verteilt, sagen sie\nnicht. »Je <span class='formel'>18 %</span>« setzt Gleichverteilung voraus — genau die Annahme, die die\nKasse beim Fisch eben widerlegt hat.<br><i>(c)</i> Beide Zahlen sind gültige Wahrscheinlichkeiten, aber zu verschiedenen\nFragen: <span class='formel'><span class='bruch'><i>1</i><i>5</i></span></span> beschreibt einen <i>gedachten</i> Gast, der blind bestellt\n(Laplace-Modell), <span class='formel'>0,28</span> schätzt, was <i>wirkliche</i> Gäste tun (statistischer\nBegriff). Für den Einkauf zählt <span class='formel'>0,28</span>. <i>Welche Zahl gilt, entscheiden die\nAxiome nicht — das entscheidet die Situation, die man beschreiben will.</i></p>"}}}, {"kuerzel": "A.4", "welt": "Mensa", "kurz": "zyklisch — begrifflich anspruchsvoll, kleiner Apparat", "bild": "bilder/Festigung_Mensa.png", "kontext": "In der Mensa steht ein grosser runder Tisch mit acht Plätzen. Acht Studierende\n setzen sich — darunter Anna und Ben sowie vier Erstsemester. Gedrehte\n Sitzordnungen gelten als gleich.\n <ul><li><b>(1)</b> Anna und Ben sitzen nebeneinander</li><li><b>(2)</b> Anna sitzt direkt links von Ben</li><li><b>(3)</b> die vier Erstsemester sitzen alle nebeneinander</li></ul>", "kapitel": {"1": {"name": "Zählen", "einleitung": "", "auftraege": ["Wie viele Sitzordnungen gibt es überhaupt? Bestimmen Sie dann alle drei\n Fallbeispiele — wo möglich <b>auf zwei Wegen</b> — und zeichnen Sie jeweils\n das Urnenmodell.", "Zu <b>(1)</b> wurde Folgendes gerechnet. Warum stimmt das nicht?\n <div class=\"fehlerkasten\">«Anna und Ben bilden einen Block. Der kann an <span class='formel'>7</span> Stellen sitzen, innen gibt\n es <span class='formel'>2</span> Reihenfolgen, die übrigen sechs sitzen beliebig: <span class='formel'>7·2·6!=10 080</span>.»</div>", "Welche Strategien aus Ihrem Baukasten haben Sie jeweils verwendet?", "<i>Abwechselnd.</i> <span class=\"knacknuss\">Knacknuss</span> Die vier Erstsemester sollen so sitzen, dass\n neben jedem von ihnen zwei Ältere sitzen — Erstsemester und Ältere wechseln sich\n also rundherum ab. Wie viele Sitzordnungen gibt es dann?"], "loesung": "<p><b>Zählen.</b><br><i>(a)</i> <i>Urnenmodell:</i> acht Namenskugeln, <i>ohne</i>\nZurücklegen und <i>mit</i> Reihenfolge ziehen und der Reihe nach rund um den Tisch\nsetzen. Weil gedrehte Sitzordnungen gleich gelten, sitzt Anna fest, und nur die\nübrigen sieben werden gezogen: <span class='formel'>|Ω|=(8-1)!=5040</span>. <i>Zweiter Weg:</i> alle\nacht ziehen und durch die acht Drehungen teilen, <span class='formel'><span class='bruch'><i>8!</i><i>8</i></span>=5040</span>. Für (3)\nkommen die vier Erstsemester als <i>eine</i> Kugel in die Urne.<br><i>(1)</i> Anna festsetzen; Ben hat <span class='formel'>2</span> der <span class='formel'>7</span> übrigen Plätze neben ihr, die\nrestlichen sechs sitzen beliebig: <span class='formel'>2·6!=1440</span>.<br><i>(2)</i> Wie (1), aber nur eine der beiden Seiten: <span class='formel'>6!=720</span> — genau die Hälfte.<br><i>(3)</i> Die vier Erstsemester als ein Objekt: fünf Objekte am runden Tisch,\n<span class='formel'>(5-1)!=24</span>; innen <span class='formel'>4!=24</span>; zusammen <span class='formel'>576</span>.</p>\n<p><i>(b) Diagnose:</i> Am runden Tisch gibt es <i>keine</i> sieben Anfangsstellen —\ndas wäre eine Reihe. Die Drehungen sind bereits herausgerechnet (<span class='formel'>|Ω|=7!</span>,\nnicht <span class='formel'>8!</span>), der Faktor <span class='formel'>7</span> zählt sie ein zweites Mal. Richtig: <span class='formel'>2·6!=1440</span>.<br>(Probe: <span class='formel'>10 080</span> ist doppelt so gross wie <span class='formel'>|Ω|=5040</span>.)</p>\n<p><i>(c)</i> <span class='formel'>|Ω|</span>: zyklisch, Teilen durch die Drehungen; (1) Block mit freier\ninnerer Reihenfolge; (2) Block mit fester; (3) grosser Block, wieder zyklisch.</p>\n<p><i>(d) Knacknuss:</i> Abwechselnd heisst: die vier Erstsemester besetzen jeden\nzweiten Platz. Setzt man einen von ihnen fest, bleiben <span class='formel'>(4-1)!=6</span> Anordnungen für\ndie Erstsemester auf ihren vier Plätzen und <span class='formel'>4!=24</span> für die Älteren auf den\ndazwischen: <span class='formel'>6·24=144</span>. <i>Zwei Einsichten auf einmal — die zyklische\nSymmetrie und die Zerlegung in zwei verschränkte Kreise.</i></p>"}, "2": {"name": "Ergebnismengen", "einleitung": "", "auftraege": ["Wählen Sie <i>eines</i> der drei Fallbeispiele. Stellen Sie <b>drei\n Ergebnismengen</b> auf: zwei, in denen sich das Fallbeispiel beschreiben lässt, und\n eine gültige, in der es <i>nicht</i> geht. Woran liegt der Unterschied?", "Warum ist die folgende Menge keine gültige Ergebnismenge?\n <div class=\"fehlerkasten\">«Ich notiere, neben wem Anna sitzt: <span class='formel'>Ω={</span>neben Ben, neben einem\n Erstsemester<span class='formel'>}</span>.»</div>", "Nennen Sie <span class='formel'>L</span> und <span class='formel'>R</span> die Ereignisse »Ben sitzt links von Anna« bzw.\n »rechts von ihr«. Schreiben Sie <b>(1)</b> damit auf. Sind <span class='formel'>L</span> und <span class='formel'>R</span>\n disjunkt? Und was ist <span class='formel'><span class='quer'>L∪ R</span></span>? Zeichnen Sie ein Bild dazu."], "loesung": "<p><b>Ergebnismengen.</b><br><i>(a) z. B. zu (2):</i> tauglich »wer auf welchem Platz sitzt« (<span class='formel'>5040</span>) und\n»wer neben Anna sitzt, links und rechts«; <i>nicht</i> tauglich »wer neben wem\nsitzt« ohne Seitenangabe — daraus geht »links von« nicht hervor.<br><i>(b)</i> Die beiden Fächer schliessen sich weder aus noch decken sie alles ab.\n<i>Überschneidung:</i> Anna hat zwei Nachbarn — sitzt links Ben und rechts ein\nErstsemester, passen beide Einträge. <i>Lücke:</i> Sitzen links und rechts die\nbeiden übrigen Älteren, passt keiner. <b>Überschneidung und Lücke zugleich.</b><br><i>(c)</i> <span class='formel'>(1)=L∪ R</span>. <span class='formel'>L</span> und <span class='formel'>R</span> sind <b>disjunkt</b> — Ben sitzt nicht\nzugleich links und rechts von Anna. <span class='formel'><span class='quer'>L∪ R</span></span> heisst »Ben sitzt nicht\nneben Anna« (<span class='formel'>5040-1440=3600</span>). Da <span class='formel'>L</span> und <span class='formel'>R</span> disjunkt sind, gilt\n<span class='formel'>|L∪ R|=|L|+|R|</span> — <i>hier</i> darf man einfach addieren, anders als bei\n<span class='formel'>K</span>, <span class='formel'>L</span>, <span class='formel'>M</span> in der Bewerbung.</p>"}, "3": {"name": "Laplace", "einleitung": "", "auftraege": ["Nehmen Sie an, die acht setzen sich <i>zufällig</i>. Bestimmen Sie die drei\n Wahrscheinlichkeiten — <i>wenn möglich</i> mit <b>zwei verschiedenen\n Ergebnismengen</b>.", "Stellen Sie den Zusammenhang zu Ihren <b>Prüffragen</b> aus der Reflexion\n her: Welche hat bei welchem Fallbeispiel den Ausschlag gegeben?", "Entlarven Sie den Fehler.\n <div class=\"fehlerkasten\">«Es gibt <span class='formel'>8</span> Plätze. Ben sitzt auf einem davon, und zwei der acht sind\n Annas Nachbarplätze. Also ist <span class='formel'>P=<span class='bruch'><i>2</i><i>8</i></span>=<span class='bruch'><i>1</i><i>4</i></span></span>.»</div>"], "loesung": "<p><b>Laplace.</b> Jede der <span class='formel'>5040</span> Sitzordnungen ist gleich wahrscheinlich.<br><i>(a)</i> <span class='formel'>P(1)=<span class='bruch'><i>1440</i><i>5040</i></span>=<span class='bruch'><i>2</i><i>7</i></span></span>; <span class='formel'>P(2)=<span class='bruch'><i>720</i><i>5040</i></span>=<span class='bruch'><i>1</i><i>7</i></span></span>;\n<span class='formel'>P(3)=<span class='bruch'><i>576</i><i>5040</i></span>=<span class='bruch'><i>4</i><i>35</i></span></span>. Für (1) und (2) trägt auch die gröbere Menge\n»welchen der sieben Plätze relativ zu Anna hat Ben« (<span class='formel'>7</span> gleich wahrscheinliche\nWerte): <span class='formel'>2</span> bzw. <span class='formel'>1</span> davon sind günstig.<br><i>(b)</i> Für (1) und (2) gibt den Ausschlag: <i>Genügt ein Ausschnitt?</i> —\nja, Bens Platz relativ zu Anna, sieben gleich wahrscheinliche Werte. Für (3) trägt\nkein Ausschnitt: Es kommt auf vier Personen zugleich an. Es bleibt die volle\nSitzordnung.<br><i>(c) Diagnose:</i> Gezählt werden hier <i>Plätze</i>, aber Anna besetzt selbst\nschon einen. Für Ben bleiben <span class='formel'>7</span> Plätze, nicht <span class='formel'>8</span> — und <span class='formel'>2</span> davon sind\nNachbarplätze: <span class='formel'><span class='bruch'><i>2</i><i>7</i></span></span>, nicht <span class='formel'><span class='bruch'><i>2</i><i>8</i></span></span>.</p>"}, "4": {"name": "Daten", "einleitung": "Anna und Ben führen beide Buch über die Sitzordnung am runden Tisch.\n<b>Anna, 500 Essen:</b> Ben sass <span class='formel'>14 %</span> der Male links von ihr, <span class='formel'>15 %</span>\nrechts. <b>Ben, 30 Essen:</b> links von Anna <span class='formel'>10 %</span>, rechts <span class='formel'>20 %</span>, neben\nihr <span class='formel'>40 %</span>, nicht neben ihr <span class='formel'>70 %</span>.", "auftraege": ["Bestimmen Sie aus Annas Zahlen, wie oft Ben neben ihr sass und wie oft\n nicht. Welche Eigenschaft von <span class='formel'>L</span> und <span class='formel'>R</span> aus dem\n zweiten Block brauchen Sie dafür? Vergleichen Sie mit dem letzten Block.", "Bens Zahlen können so nicht stimmen. Finden Sie <i>alle</i> Stellen, die nicht\n zusammenpassen, und nennen Sie jeweils das Axiom oder die Folgerung, gegen die sie\n verstossen.", "Ben korrigiert: links <span class='formel'>10 %</span>, rechts <span class='formel'>30 %</span>, neben <span class='formel'>40 %</span>, nicht neben\n <span class='formel'>60 %</span>. Jetzt widerspricht nichts mehr — und doch sagen Anna und Ben\n Verschiedenes. Wer hat recht? Was können die Axiome hier entscheiden, und was\n nicht?"], "loesung": "<p><b>Daten.</b><br><i>(a)</i> <span class='formel'>L</span> und <span class='formel'>R</span> sind <b>disjunkt</b>, also nach K3\n<span class='formel'>h(L∪ R)=0,14+0,15=0,29</span>; nicht neben Anna <span class='formel'>1-0,29=0,71</span>. Das liegt\nnahe bei <span class='formel'><span class='bruch'><i>2</i><i>7</i></span>≈0,286</span> aus dem letzten Block.<br><i>(b)</i> Zwei Brüche: <span class='formel'>10 %+20 %=30 %≠40 %</span> — gegen <b>K3</b>;\n<span class='formel'>40 %+70 %=110 %</span> — gegen <span class='formel'>P(A)+P(<span class='quer'>A</span>)=1</span>, also letztlich\n<b>K2</b>. <i>Eine Erhebung kann an mehreren Regeln zugleich scheitern —\nwie in der Reflexion.</i><br><i>(c)</i> Beide Erhebungen sind jetzt <i>verträglich</i> mit den Axiomen, und keine ist\ndamit richtig. Die Axiome sagen nur, welche Erhebung <i>nicht sein kann</i>, nie,\nwelche stimmt. Entscheiden müssen die Daten: Annas <span class='formel'>29 %</span> beruhen auf <span class='formel'>500</span>\nEssen, Bens <span class='formel'>40 %</span> auf <span class='formel'>30</span>. <i>Verträglich heisst nicht richtig.</i></p>"}}}, {"kuerzel": "A.5", "welt": "Hotel", "kurz": "Teilen durch Symmetrie, die schwerste Einzelidee", "bild": "bilder/Festigung_Hotel.png", "kontext": "Ein Hotel hat drei Doppelzimmer (Nr. 1, 2, 3). Sechs Gäste\n werden zufällig auf die Zimmer verteilt — darunter Herr und Frau Brügger\n sowie Herr und Frau Keller. Innerhalb eines Zimmers spielt es keine Rolle,\n wer welches Bett nimmt.\n <ul><li><b>(1)</b> Herr und Frau Brügger teilen ein Zimmer</li><li><b>(2)</b> Herr Brügger wohnt in Zimmer 1</li><li><b>(3)</b> beide Paare teilen je ein Zimmer</li></ul>", "kapitel": {"1": {"name": "Zählen", "einleitung": "", "auftraege": ["Wie viele Zimmerbelegungen gibt es überhaupt? Bestimmen Sie dann alle drei\n Fallbeispiele und zeichnen Sie die Urnenmodelle — wo möglich auf zwei Wegen.", "Zur <b>Gesamtzahl</b> wurde Folgendes gerechnet. Warum stimmt das nicht?\n <div class=\"fehlerkasten\">«Sechs Gäste auf sechs Betten — das sind <span class='formel'>6!=720</span> Belegungen.»</div>", "<i>Dieselben Gäste, andere Zimmer.</i> <span class=\"knacknuss\">Knacknuss</span> Die drei Zimmer werden durch drei <b>identische\n Bungalows</b> ersetzt — man kann sie nicht auseinanderhalten. Wie viele Belegungen\n gibt es jetzt? Welche Strategie brauchen Sie, und wo im Eis kam sie schon vor?"], "loesung": "<p><b>Zählen.</b><br><i>(a)</i> <i>Urnenmodell:</i> sechs Namenskugeln, <i>ohne</i>\nZurücklegen; die ersten zwei gezogenen wohnen in Zimmer 1, die nächsten zwei in\nZimmer 2, die letzten zwei in Zimmer 3 — innerhalb eines Zimmers <i>ohne</i>\nReihenfolge: <span class='formel'><span class='binom'><i>6</i><i>2</i></span><span class='binom'><i>4</i><i>2</i></span><span class='binom'><i>2</i><i>2</i></span>=15·6·1=90</span>. <i>Zweiter Weg:</i>\nalle sechs mit Reihenfolge ziehen und die Betten herausteilen,\n<span class='formel'><span class='bruch'><i>6!</i><i>(2!)<sup>3</sup></i></span>=<span class='bruch'><i>720</i><i>8</i></span>=90</span>. Für (1) kommt das Paar Brügger als\n<i>ein</i> Kugelpaar in die Urne.<br><i>(1)</i> Brüggers zusammen: <span class='formel'>3</span> Zimmer für das Paar <span class='formel'>·\\ <span class='bruch'><i>4!</i><i>(2!)<sup>2</sup></i></span>=6</span>\nfür die übrigen vier <span class='formel'>=18</span>.<br><i>(2)</i> Herr Brügger in Zimmer 1: <span class='formel'>5</span> mögliche Zimmergenossen <span class='formel'>·</span> <span class='formel'><span class='bruch'><i>4!</i><i>(2!)<sup>2</sup></i></span>=6</span>\nBelegungen der übrigen zwei Zimmer <span class='formel'>=30</span>; kürzer: er wohnt gleich wahrscheinlich in\neinem der drei Zimmer, also <span class='formel'>90/3=30</span>.<br><i>(3)</i> beide Paare zusammen: <span class='formel'>3·2·1=6</span>.</p>\n<p><i>(b) Diagnose:</i> <span class='formel'>6!</span> zählt auch, <i>welches Bett</i> jemand im Zimmer nimmt —\ndas soll aber nicht unterschieden werden. Je Zimmer sind <span class='formel'>2!</span> Belegungen dieselbe,\nbei drei Zimmern also <span class='formel'>(2!)<sup>3</sup>=8</span>: <span class='formel'>720/8=90</span>.</p>\n<p><i>(c) Andere Zimmer:</i> Jetzt sind zusätzlich die drei <i>Behälter</i> vertauschbar —\njede Belegung wird <span class='formel'>3!=6</span>-mal gezählt: <span class='formel'>90/3!=15</span>. Also\n<span class='formel'><span class='bruch'><i>6!</i><i>(2!)<sup>3</sup>·3!</i></span>=15</span>. Dieselbe Strategie wie bei Eis 16: sechs\nSorten auf drei gleiche Becher — auch dort <span class='formel'>15</span>.</p>"}, "2": {"name": "Ergebnismengen", "einleitung": "", "auftraege": ["Stellen Sie <b>zwei Ergebnismengen</b> auf: eine, die festhält <i>wer in\n welchem Zimmer</i> wohnt, und eine gröbere, die nur festhält <i>wer mit wem</i>. Wie\n viele Elemente hat jede? Welches der drei Fallbeispiele lässt sich mit der gröberen\n <i>nicht</i> beschreiben?", "Warum ist das keine gültige Ergebnismenge?\n <div class=\"fehlerkasten\">«Ich notiere, welches Paar zusammen wohnt:\n <span class='formel'>Ω={</span>Brügger zusammen, Keller zusammen<span class='formel'>}</span>.»</div>", "Setzen Sie <span class='formel'>B=</span> »Brüggers zusammen« und <span class='formel'>K=</span> »Kellers zusammen«. Schreiben Sie\n <b>(3)</b> symbolisch. Sind <span class='formel'>B</span> und <span class='formel'>K</span> disjunkt? Bestimmen Sie <span class='formel'>|B∪ K|</span> auf\n zwei Arten und zeichnen Sie das Venn."], "loesung": "<p><b>Ergebnismengen.</b><br><i>(a)</i> »wer in welchem Zimmer« (<span class='formel'>90</span>) und »wer mit wem« (<span class='formel'>15</span> Paarungen).\nMit der gröberen lässt sich <b>(2)</b> nicht beschreiben — sie verrät die\nZimmernummer nicht. (1) und (3) leben auf beiden.<br><i>(b)</i> <b>Lücke und Überschneidung zugleich:</b> Belegungen, in denen\n<i>keines</i> der Paare zusammen wohnt, haben kein Notat (Lücke); und wenn\n<i>beide</i> zusammen wohnen — Fallbeispiel (3)! — passen beide Einträge\n(Überschneidung).<br><i>(c)</i> <span class='formel'>(3)=B∩ K</span>. <i>Nicht</i> disjunkt, denn <span class='formel'>B∩ K</span> hat <span class='formel'>6</span> Elemente.\n<span class='formel'>|B∪ K|=18+18-6=30</span>; direkt: <span class='formel'>90-60=30</span> (in <span class='formel'>60</span> Belegungen wohnt kein Paar\nzusammen).</p>"}, "3": {"name": "Laplace", "einleitung": "", "auftraege": ["Bestimmen Sie die drei Wahrscheinlichkeiten — <i>wenn möglich</i> mit\n <b>zwei verschiedenen Ergebnismengen</b>.", "Stellen Sie den Zusammenhang zu Ihren <b>Prüffragen</b> aus der Reflexion\n her: Welche hat bei welchem Fallbeispiel den Ausschlag gegeben?", "Hier gelingen <i>überall</i> zwei Ergebnismengen — bei der Bewerbung\n dagegen führte die gröbere (»Anzahl der Frauen«) zu einer falschen Zahl. Woran\n liegt der Unterschied?", "Entlarven Sie den Fehler.\n <div class=\"fehlerkasten\">«Die Zimmernummern sind ja eigentlich egal, also gibt es nur <span class='formel'>15</span>\n Belegungen. Günstig für (1) sind <span class='formel'>18</span>. Also <span class='formel'>P=<span class='bruch'><i>18</i><i>15</i></span></span>.»</div>"], "loesung": "<p><b>Wahrscheinlichkeit.</b><br><i>(a)</i> <span class='formel'>P(1)=<span class='bruch'><i>18</i><i>90</i></span>=<span class='bruch'><i>1</i><i>5</i></span></span> — grob: <span class='formel'><span class='bruch'><i>3</i><i>15</i></span>=<span class='bruch'><i>1</i><i>5</i></span></span>.\n<span class='formel'>P(2)=<span class='bruch'><i>30</i><i>90</i></span>=<span class='bruch'><i>1</i><i>3</i></span></span> — grob über »welches Zimmer hat Herr Brügger«:\n<span class='formel'><span class='bruch'><i>1</i><i>3</i></span></span>. <span class='formel'>P(3)=<span class='bruch'><i>6</i><i>90</i></span>=<span class='bruch'><i>1</i><i>15</i></span></span> — grob: <span class='formel'><span class='bruch'><i>1</i><i>15</i></span></span>.<br><i>(b)</i> <i>Gröbere Einteilung?</i> Für (1) und (3) trägt »wer mit wem«. Für\n(2) trägt der <i>Ausschnitt</i> »in welchem Zimmer wohnt Herr Brügger« — drei\ngleich wahrscheinliche Zimmer.<br><i>(c)</i> Hier wiegt <i>jede</i> Paarung gleich: zu jeder gehören genau <span class='formel'>3!=6</span>\nZimmerbelegungen (<span class='formel'>15·6=90</span>). Bei der Bewerbung dagegen wiegen die vier Werte\nvon »Anzahl der Frauen« <span class='formel'>35</span>, <span class='formel'>105</span>, <span class='formel'>63</span> und <span class='formel'>7</span> — darum ist die grobe Menge\ndort nicht Laplace.<br><i>(d) Diagnose:</i> Zähler und Nenner stammen aus <i>verschiedenen</i>\nErgebnismengen — <span class='formel'>18</span> zählt Zimmerbelegungen, <span class='formel'>15</span> zählt Paarungen. Schon\n<span class='formel'><span class='bruch'><i>18</i><i>15</i></span>&gt;1</span> zeigt, dass das nicht sein kann. Richtig ist entweder\n<span class='formel'><span class='bruch'><i>18</i><i>90</i></span></span> oder <span class='formel'><span class='bruch'><i>3</i><i>15</i></span></span> — beide <span class='formel'><span class='bruch'><i>1</i><i>5</i></span></span>.</p>"}, "4": {"name": "Daten", "einleitung": "Familie Brügger war <b>fünfmal</b> in diesem Hotel und bekam <b>nie</b> ein\ngemeinsames Zimmer. Das Hotel selbst hat über <b>300 Aufenthalte</b> von Paaren\nBuch geführt: <span class='formel'>61</span>-mal teilte das Paar ein Zimmer.", "auftraege": ["Bestimmen Sie beide relativen Häufigkeiten und vergleichen Sie sie mit\n <span class='formel'>P(1)</span> aus dem letzten Block.", "Was ist an diesem Schluss falsch?\n <div class=\"fehlerkasten\">«Fünfmal da, nie zusammen — die relative Häufigkeit ist <span class='formel'>0</span>. Ein\n gemeinsames Zimmer ist in diesem Hotel also unmöglich.»</div>", "Beim sechsten Aufenthalt bekommen Brüggers ein gemeinsames Zimmer. Um wie viel\n ändert sich ihre relative Häufigkeit — und um wie viel die des Hotels, wenn ein\n Paar dazukommt? Was sagt Ihnen das über die beiden Zahlen?"], "loesung": "<p><b>Daten.</b><br><i>(a)</i> <span class='formel'>h₅=0</span>, <span class='formel'>h₃₀₀=<span class='bruch'><i>61</i><i>300</i></span>≈0,203</span>; erwartet <span class='formel'>P(1)=<span class='bruch'><i>1</i><i>5</i></span></span>.\nDie Hotelzahl passt zum Modell, Brüggers Zahl liegt weit daneben.<br><i>(b) Diagnose:</i> Verwechselt sind relative Häufigkeit und Wahrscheinlichkeit —\nund dazu wird eine Folgerung verkehrt herum gelesen. Aus den Axiomen folgt\n<span class='formel'>P(∅)=0</span>: Was unmöglich ist, hat Wahrscheinlichkeit <span class='formel'>0</span>. Umgekehrt heisst\n<span class='formel'>h₅=0</span> nur, dass es in fünf Versuchen nicht eingetreten ist. Unter zufälliger\nZuteilung ist <span class='formel'>P(1)=<span class='bruch'><i>1</i><i>5</i></span></span>, und fünf Fehlschläge hintereinander sind dabei nichts\nAussergewöhnliches.<br><i>(c)</i> Brüggers: von <span class='formel'>0</span> auf <span class='formel'><span class='bruch'><i>1</i><i>6</i></span>≈0,167</span> — ein einziger Aufenthalt\nverschiebt die Zahl um fast <span class='formel'>17</span> Prozentpunkte. Hotel: von <span class='formel'>0,203</span> auf\n<span class='formel'><span class='bruch'><i>62</i><i>301</i></span>≈0,206</span> oder <span class='formel'><span class='bruch'><i>61</i><i>301</i></span>≈0,203</span> — höchstens\n<span class='formel'>0,3</span> Prozentpunkte. Das ist das empirische Gesetz der grossen Zahlen im\nKleinen: Bei grossem <span class='formel'>n</span> fällt der einzelne Versuch kaum noch ins Gewicht.\nBrüggers Erfahrung betrifft sie selbst, sagt aber über die Wahrscheinlichkeit\nweniger als das Hotelbuch.</p>"}}}, {"kuerzel": "A.6", "welt": "Musikfestival", "kurz": "Multinomial, Slot-Argumente — der grösste Apparat", "bild": "bilder/Festigung_Festival.png", "kontext": "Neun Bands treten auf drei Bühnen auf — auf jeder Bühne spielen genau drei\n nacheinander. Drei der neun sind Headliner.\n <ul><li><b>(1)</b> jeder Headliner spielt auf seiner Bühne als Letzter</li><li><b>(2)</b> die beiden lautesten Bands spielen auf derselben Bühne</li><li><b>(3)</b> Ihre Lieblingsband spielt auf Bühne A</li></ul>", "kapitel": {"1": {"name": "Zählen", "einleitung": "", "auftraege": ["Wie viele Spielpläne gibt es überhaupt? Bestimmen Sie das <b>auf zwei\n Wegen</b>. Bestimmen Sie dann alle drei Fallbeispiele und zeichnen Sie jeweils das\n Urnenmodell.", "Zu <b>(2)</b> wurde Folgendes gerechnet. Warum stimmt das nicht?\n <div class=\"fehlerkasten\">«Die zweite der beiden Bands landet auf einer der drei Bühnen, und in einem\n von drei Fällen ist es dieselbe wie bei der ersten. Also <span class='formel'>9!/3=120 960</span>.»</div>", "Welche Strategien aus Ihrem Baukasten haben Sie jeweils verwendet?", "<i>Ihr eigenes Programm.</i> <span class=\"knacknuss\">Knacknuss</span> Sie entscheiden für jede der\n neun Bands, ob Sie hingehen. Wie viele Programme sind möglich? Und wie viele,\n wenn Sie genau zwei oder drei Bands sehen wollen?"], "loesung": "<p><b>Zählen.</b><br><i>(a)</i> <i>Urnenmodell:</i> neun Bandkugeln, <i>ohne</i>\nZurücklegen und <i>mit</i> Reihenfolge auf die neun Slots A1, A2, A3, B1, …,\nC3: <span class='formel'>|Ω|=9!=362 880</span>. Für (1) kommen die drei Headliner in eine eigene Urne\nfür die drei Schluss-Slots, die übrigen sechs in eine zweite.\n<i>Zweiter Weg:</i> erst die Zuteilung auf die Bühnen\n<span class='formel'><span class='bruch'><i>9!</i><i>3! 3! 3!</i></span>=1680</span>, dann die Reihenfolge auf jeder Bühne\n<span class='formel'>(3!)<sup>3</sup>=216</span> — zusammen <span class='formel'>1680·216=362 880</span>.<br><i>(1)</i> Die drei Headliner auf die drei Schluss-Slots: <span class='formel'>3!=6</span>; die übrigen sechs\nBands auf die sechs übrigen Slots: <span class='formel'>6!=720</span>. Also <span class='formel'>6·720=4320</span>.<br><i>(2)</i> Die erste der beiden Bands steht irgendwo; für die zweite bleiben <span class='formel'>8</span>\nSlots, davon liegen <span class='formel'>2</span> auf derselben Bühne: <span class='formel'>9!·<span class='bruch'><i>2</i><i>8</i></span>=90 720</span>.<br><i>(3)</i> Drei der neun Slots liegen auf Bühne A: <span class='formel'>9!·<span class='bruch'><i>3</i><i>9</i></span>=120 960</span>.</p>\n<p><i>(b) Diagnose:</i> Nicht die <i>Bühnen</i> sind hier gleich wahrscheinlich,\nsondern die <i>Slots</i>. Ist die erste Band platziert, bleiben <span class='formel'>8</span> freie Slots —\nund nur <span class='formel'>2</span> davon liegen auf ihrer Bühne, nicht <span class='formel'><span class='bruch'><i>1</i><i>3</i></span></span> von allen. Richtig ist\n<span class='formel'><span class='bruch'><i>2</i><i>8</i></span>=<span class='bruch'><i>1</i><i>4</i></span></span>, also <span class='formel'>90 720</span>.</p>\n<p><i>(c)</i> <span class='formel'>|Ω|</span>: Permutation <i>und</i> Multinomialkoeffizient (zwei Wege);\n(1) feste Plätze mal Rest; (2) und (3) Anteil der günstigen Slots.</p>\n<p><i>(d) Knacknuss:</i> Für jede Band ja oder nein — <span class='formel'>2<sup>9</sup>=512</span> Programme<br><i>(Potenzmenge, wie bei Eis 10: sechs Toppings)</i>. Genau zwei oder drei:\n<span class='formel'><span class='binom'><i>9</i><i>2</i></span>+<span class='binom'><i>9</i><i>3</i></span>=36+84=120</span> — »oder« heisst <b>addieren</b><br><i>(Eis 8: zwei oder drei Kugeln)</i>.</p>"}, "2": {"name": "Ergebnismengen", "einleitung": "", "auftraege": ["Wählen Sie <i>eines</i> der drei Fallbeispiele. Stellen Sie <b>drei\n Ergebnismengen</b> auf: zwei, in denen sich das Fallbeispiel beschreiben lässt, und\n eine gültige, in der es <i>nicht</i> geht. Woran liegt der Unterschied?", "Warum ist die folgende Menge keine gültige Ergebnismenge?\n <div class=\"fehlerkasten\">«Ich notiere, wie viele Bands vor meiner Lieblingsband auf deren Bühne\n spielen: <span class='formel'>Ω={0,1,2,…,8}</span>.»</div>", "Nennen Sie <span class='formel'>H₁</span>, <span class='formel'>H₂</span>, <span class='formel'>H₃</span> die Ereignisse »der erste / zweite / dritte\n Headliner spielt auf seiner Bühne als Letzter«. Schreiben Sie <b>(1)</b> damit\n auf — und ebenso das Gegenereignis, auf <i>zwei</i> Arten. Was fällt beim\n Vergleich auf?"], "loesung": "<p><b>Ergebnismengen.</b><br><i>(a) z. B. zu (3):</i> tauglich »welche Band in welchem Slot« (<span class='formel'>9!</span>) und\n»auf welcher Bühne die Lieblingsband spielt« (<span class='formel'>3</span>); <i>nicht</i> tauglich »auf\nwelcher Bühne die drei Headliner spielen« — daraus geht nicht hervor, wo die\nLieblingsband steht.<br><i>(b)</i> <b>Überschuss:</b> Auf einer Bühne spielen nur drei Bands, vor der\neigenen können also höchstens <i>zwei</i> anderen spielen. Die Werte <span class='formel'>3</span> bis <span class='formel'>8</span>\ntreten nie ein.<br><i>(c)</i> <span class='formel'>(1)=H₁∩ H₂∩ H₃</span>. Gegenereignis:\n<span class='formel'><span class='quer'>H₁∩ H₂∩ H₃</span>=<span class='quer'>H₁</span>∪<span class='quer'>H₂</span>∪<span class='quer'>H₃</span></span>\n— »mindestens ein Headliner spielt nicht zuletzt«. <b>De Morgan.</b></p>"}, "3": {"name": "Laplace", "einleitung": "", "auftraege": ["Nehmen Sie an, der Spielplan wird <i>ausgelost</i>. Bestimmen Sie die drei\n Wahrscheinlichkeiten — <i>wenn möglich</i> mit <b>zwei verschiedenen\n Ergebnismengen</b>.", "Stellen Sie den Zusammenhang zu Ihren <b>Prüffragen</b> aus der Reflexion\n her: Welche hat bei welchem Fallbeispiel den Ausschlag gegeben?", "Entlarven Sie den Fehler.\n <div class=\"fehlerkasten\">«Jeder Headliner spielt auf seiner Bühne mit Wahrscheinlichkeit\n <span class='formel'><span class='bruch'><i>1</i><i>3</i></span></span> als Letzter. Für alle drei zusammen also\n <span class='formel'>(<span class='bruch'><i>1</i><i>3</i></span>)<sup>3</sup>=<span class='bruch'><i>1</i><i>27</i></span></span>.»</div>"], "loesung": "<p><b>Laplace.</b> Jeder der <span class='formel'>9!</span> Spielpläne ist gleich wahrscheinlich.<br><i>(a)</i> <span class='formel'>P(1)=<span class='bruch'><i>4320</i><i>362 880</i></span>=<span class='bruch'><i>1</i><i>84</i></span></span>;\n<span class='formel'>P(2)=<span class='bruch'><i>90 720</i><i>362 880</i></span>=<span class='bruch'><i>1</i><i>4</i></span></span>;\n<span class='formel'>P(3)=<span class='bruch'><i>120 960</i><i>362 880</i></span>=<span class='bruch'><i>1</i><i>3</i></span></span> — <i>und</i> auf der groben Menge\n»Bühne der Lieblingsband« ebenfalls <span class='formel'><span class='bruch'><i>1</i><i>3</i></span></span>: zwei Ergebnismengen, gleiches\nErgebnis.<br><i>(b)</i> Nur bei (3) trägt eine gröbere Menge — die drei Bühnen sind für eine\neinzelne Band gleich wahrscheinlich. (1) und (2) brauchen die feine Menge.<br><i>(c) Diagnose:</i> Die drei Ereignisse beeinflussen sich: Steht ein Headliner am\nSchluss einer Bühne, ist dieser Schlussplatz für die anderen besetzt. Einfach\nmultiplizieren darf man darum nicht. Richtig:\n<span class='formel'><span class='bruch'><i>3!·6!</i><i>9!</i></span>=<span class='bruch'><i>1</i><i>84</i></span>≈0,012</span>, nicht <span class='formel'><span class='bruch'><i>1</i><i>27</i></span>≈0,037</span>.</p>"}, "4": {"name": "Daten", "einleitung": "Betrachtet wird nur noch, auf welcher Bühne Ihre Lieblingsband spielt:\n<span class='formel'>Ω={A,B,C}</span>. Die Veranstalterin sagt, die grossen Namen kämen eher auf\nBühne A, und schlägt vor: <span class='formel'>P({A})=<span class='bruch'><i>1</i><i>2</i></span></span>, <span class='formel'>P({B})=P({C})=<span class='bruch'><i>1</i><i>4</i></span></span>.", "auftraege": ["Ergänzen Sie <span class='formel'>P</span> für <i>alle acht</i> Ereignisse und prüfen Sie, ob damit ein\n Wahrscheinlichkeitsmass vorliegt — Axiom für Axiom.", "Warum genügt diese Begründung nicht?\n <div class=\"fehlerkasten\">«Ich setze <span class='formel'>P({A})=0,45</span>, <span class='formel'>P({B})=0,35</span>, <span class='formel'>P({C})=0,30</span>. Alle\n drei liegen zwischen <span class='formel'>0</span> und <span class='formel'>1</span> — also ist das ein Wahrscheinlichkeitsmass.»</div>", "Auch die Gleichverteilung aus dem letzten Block ist ein\n Wahrscheinlichkeitsmass. Welches der beiden Modelle stimmt? Was können die Axiome\n dazu sagen? In den letzten <span class='formel'>40</span> Jahren spielte Ihre Lieblingsband <span class='formel'>17</span>-mal auf\n Bühne A — wohin weist das, und wie sicher?"], "loesung": "<p><b>Daten.</b><br><i>(a)</i> <span class='formel'>P(∅)=0</span>, <span class='formel'>P({A})=<span class='bruch'><i>1</i><i>2</i></span></span>, <span class='formel'>P({B})=P({C})=<span class='bruch'><i>1</i><i>4</i></span></span>,\n<span class='formel'>P({A,B})=P({A,C})=<span class='bruch'><i>3</i><i>4</i></span></span>, <span class='formel'>P({B,C})=<span class='bruch'><i>1</i><i>2</i></span></span>, <span class='formel'>P(Ω)=1</span>. <b>K1</b>:\nkein Wert negativ. <b>K2</b>: <span class='formel'>P(Ω)=1</span>. <b>K3</b>: Jedes Ereignis ist die\nSumme seiner Elemente, und für disjunkte Ereignisse addieren sich diese Summen —\netwa <span class='formel'>P({A}∪{B,C})=<span class='bruch'><i>1</i><i>2</i></span>+<span class='bruch'><i>1</i><i>2</i></span>=1</span>. Ein Wahrscheinlichkeitsmass.<br><i>(b) Diagnose:</i> »Zwischen <span class='formel'>0</span> und <span class='formel'>1</span>« prüft nur K1 (und die obere Grenze, die\nerst aus den Axiomen folgt). K2 und K3 zusammen verlangen\n<span class='formel'>P({A})+P({B})+P({C})=P(Ω)=1</span> — hier sind es <span class='formel'>1,1</span>.<br><i>(c)</i> Die Axiome entscheiden es nicht: Sie lassen beide Modelle zu (und\nunendlich viele weitere). <i>Sie regeln, was ein gültiges Mass ist, nicht,\nwelches die Wirklichkeit trifft.</i> Die Daten: <span class='formel'><span class='bruch'><i>17</i><i>40</i></span>=0,425</span> liegt zwischen\n<span class='formel'><span class='bruch'><i>1</i><i>3</i></span></span> und <span class='formel'><span class='bruch'><i>1</i><i>2</i></span></span> — bei <span class='formel'>40</span> Werten noch kein klarer Hinweis. Es braucht\nmehr Jahre.</p>"}}}], "kapitel": [{"nr": 1, "name": "Zählen", "farbe": "aktion", "hex": "#9867A5"}, {"nr": 2, "name": "Ergebnismengen", "farbe": "zugang", "hex": "#007D57"}, {"nr": 3, "name": "Laplace", "farbe": "beweis", "hex": "#E09E5A"}, {"nr": 4, "name": "Daten", "farbe": "fach", "hex": "#0065A9"}]};
let stand = {welt: 0, kapitel: 1};

function farbe(nr){
  const k = D.kapitel.find(x => x.nr === nr);
  return k ? k.hex : '#9867A5';
}

/* Die Landkarte. Sie steht immer da - das ist die Entscheidung aus der
   Arbeitsliste: «Man sieht sonst nicht, wo man steht, und die Matrix ist
   gerade der Witz an der Sache.» */
function matrix(){
  const t = document.getElementById('matrix');
  // ENTSCHEIDUNG (2026-08-21, nach Rikes Rueckmeldung): Der Kopf traegt
  // nur noch die Kapitelzahl, nicht mehr den Namen. Zwei Gruende, beide
  // von Rike: «Ergebnismengen» ist viel laenger als «Daten» und zieht
  // die Spalte breit, obwohl alle vier gleich viel wiegen - und die
  // Namen stehen ohnehin auf jeder Aufgabenseite. Verworfen: den Kopf
  // ganz weglassen. Dann steht ueber der ersten Spalte nichts, und die
  // Zahlen in den Zellen muessten allein die Ordnung tragen.
  let h = '<tr><th></th>' + D.kapitel.map(k =>
      `<th style="color:${k.hex}" title="${k.name}">${k.nr}</th>`).join('') + '</tr>';
  D.welten.forEach((w, i) => {
    h += `<tr><th class="welt">`
       + (w.bild ? `<img class="weltbild" src="${w.bild}" alt="">` : '')
       + `${w.welt}</th>`;
    D.kapitel.forEach(k => {
      const da = !!w.kapitel[k.nr];
      const hier = (i === stand.welt && k.nr === stand.kapitel);
      h += `<td><button class="zelle" data-w="${i}" data-k="${k.nr}"
              aria-current="${hier}"
              style="border-color:${k.hex};${hier ? 'background:' + k.hex : ''}"
              ${da ? '' : 'disabled'}>${da ? k.nr : '—'}</button></td>`;
    });
    h += '</tr>';
  });
  t.innerHTML = h;
  t.querySelectorAll('.zelle').forEach(b => b.onclick = () => {
    stand.welt = +b.dataset.w; stand.kapitel = +b.dataset.k; zeigen();
  });
}

function zeigen(){
  const w = D.welten[stand.welt];
  const k = w.kapitel[stand.kapitel];
  const kap = D.kapitel.find(x => x.nr === stand.kapitel);
  document.documentElement.style.setProperty('--akzent', kap.hex);
  // Derselbe Ton, stark aufgehellt - Grund fuer den Fehlerkasten.
  document.documentElement.style.setProperty('--akzentblass', kap.hex + '14');
  document.getElementById('streifen').style.background = kap.hex;
  document.getElementById('wostehe').textContent =
    `${w.welt} · Kapitel ${kap.nr} — ${kap.name}`;

  const a = document.getElementById('aufgabe');
  if (!k){ a.innerHTML = '<p>Zu diesem Feld gibt es noch keine Aufgabe.</p>';
           matrix(); return; }

  a.innerHTML = `
    <div class="kopfzeile">
      ${w.bild ? `<img src="${w.bild}" alt="">` : ''}
      <div>
        <p class="welt">${w.welt}</p>
        <p class="kurz">${w.kurz}</p>
        <div class="kontext">${w.kontext}</div>
      </div>
    </div>
    <div class="schwerpunkt">
      <span class="nr">${kap.nr}</span>
      <h3>${k.name}</h3>
    </div>
    ${k.einleitung ? `<p class="einleitung">${k.einleitung}</p>` : ''}
    <ol class="auftraege" type="a">
      ${k.auftraege.map(x => `<li>${x}</li>`).join('')}
    </ol>
    <div class="loesung" id="loesung">
      <button id="loesungknopf">Lösung zeigen</button>
      <div class="inhalt">${k.loesung
        ? k.loesung
        : '<span class="fehlt">Zu dieser Aufgabe ist noch keine Lösung '
          + 'geschrieben. Im Skript steht an ihrer Stelle bisher nur ein '
          + 'Vermerk.</span>'}</div>
    </div>
    <div class="weiter" id="weiter"></div>`;

  document.getElementById('loesungknopf').onclick = () => {
    const l = document.getElementById('loesung');
    l.classList.toggle('offen');
    document.getElementById('loesungknopf').textContent =
      l.classList.contains('offen') ? 'Lösung verbergen' : 'Lösung zeigen';
  };

  /* Zwei Wege durch die Matrix - nach rechts oder nach unten. Sie sind
     Knoepfe UND in der Landkarte sichtbar; wer lieber springt, klickt
     dort. Blindes Verzweigen gibt es nicht. */
  const weiter = document.getElementById('weiter');
  const rechts = D.kapitel.find(x => x.nr === stand.kapitel + 1);
  const unten = D.welten[stand.welt + 1];
  let h = '';
  if (rechts && w.kapitel[rechts.nr])
    h += `<button data-w="${stand.welt}" data-k="${rechts.nr}">`
       + `<b>nach rechts — dieselbe Welt, nächstes Kapitel</b>`
       + `${w.welt} · ${rechts.nr} ${rechts.name}</button>`;
  if (unten && unten.kapitel[stand.kapitel])
    h += `<button data-w="${stand.welt + 1}" data-k="${stand.kapitel}">`
       + `<b>nach unten — dasselbe Kapitel, andere Welt</b>`
       + `${unten.welt} · ${kap.nr} ${kap.name}</button>`;
  weiter.innerHTML = h || '<span class="kurz">Hier endet die Matrix. '
                        + 'Über die Landkarte geht es weiter.</span>';
  weiter.querySelectorAll('button').forEach(b => b.onclick = () => {
    stand.welt = +b.dataset.w; stand.kapitel = +b.dataset.k; zeigen();
    document.getElementById('aufgabe').scrollTop = 0;
  });

  matrix();
}

matrix(); zeigen();
</script>
</body></html>
