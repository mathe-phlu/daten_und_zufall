, sie mit zwei verschiedenen der 4 Neuzugänge besetzen (4·3) und den dritten mit einem der 4 Klassiker."}, {"id": "LBK22", "spalte": 2, "vkue": "V2", "richtig": true, "menge": "Ω = {{Erdbeer, Haselnuss, Himbeer};  …;  {Stracciatella, Vanille, Zitrone}}", "denkweg": "Wo die Kugeln liegen, ist mir egal — ich notiere nur, welche drei Sorten es sind: 56 Dreiergruppen. Günstig: zwei der 4 Neuzugänge und einer der 4 Klassiker."}, {"id": "LBK27", "spalte": 4, "vkue": "V7", "richtig": false, "menge": "Ω = {(K, K, K);  (K, K, N);  (K, N, K);  (K, N, N);  (N, K, K);  (N, K, N);  (N, N, K);  (N, N, N)}", "denkweg": "Ob Klassiker oder Neuzugang, genügt mir. Ich notiere für jede Kugel nur K oder N: 8 Muster. Günstig sind die mit genau zwei N — davon gibt es 3."}, {"id": "LBK28", "spalte": 4, "vkue": "V8", "richtig": false, "menge": "Ω = {{K, K, K};  {K, K, N};  {K, N, N};  {N, N, N}}", "denkweg": "Noch gröber: Ich notiere nur, wie viele Neuzugänge dabei sind — keiner, einer, zwei oder drei. Vier Fälle, einer davon ist «zwei»."}, {"id": "LBAU11", "spalte": 1, "vkue": "V1", "richtig": true, "menge": "Ω = {(Erdbeer, Haselnuss, Himbeer);  …;  (Zitrone, Vanille, Stracciatella)}", "denkweg": "Ich schreibe jede Bestellung als Reihe auf: 8·7·6. Günstig: Schokolade liegt unten oder in der Mitte — 2 Plätze —, daneben eine der 7 übrigen Sorten und oben eine der 6 restlichen."}, {"id": "LBAU13", "spalte": 3, "vkue": "V3", "richtig": true, "menge": "Ω = {(Erdbeer, Haselnuss);  …;  (Zitrone, Vanille)}", "denkweg": "Das Ereignis redet nur über die beiden unteren Kugeln. Ich notiere nur sie, mit ihrer Lage: 8·7 Paare, weil keine Sorte doppelt kommt. Günstig: Schokolade auf einem der 2 Plätze, daneben eine der 7 übrigen."}, {"id": "LBAU14", "spalte": 3, "vkue": "V4", "richtig": true, "menge": "Ω = {{Erdbeer, Haselnuss};  …;  {Vanille, Zitrone}}", "denkweg": "Das Ereignis redet nur über die beiden unteren Kugeln, und wo genau, ist ihm egal. Ich notiere nur, welche zwei Sorten dort liegen: 28 Paare. Günstig: Schokolade und eine der 7 übrigen."}], "fragen": [{"id": "f2a", "spalte": 2, "text": "Wo gibt es hier eine Rechnung — und wo <b>keine</b>? Woran liegt das?"}, {"id": "f2b", "spalte": 2, "text": "Wo es eine gibt: Wann <b>stimmt</b> sie, wann nicht? Woran liegt <i>das</i>?"}, {"id": "f3a", "spalte": 3, "text": "Wo gibt es hier eine Rechnung — und wo <b>keine</b>? Woran liegt das?"}, {"id": "f3b", "spalte": 3, "text": "Wo es eine gibt: Wann <b>stimmt</b> sie, wann nicht?"}, {"id": "f4a", "spalte": 4, "text": "Wo gibt es hier eine Rechnung — und wo <b>keine</b>? Woran liegt das?"}, {"id": "f4b", "spalte": 4, "text": "Wo es eine gibt: Wann <b>stimmt</b> sie, wann nicht? Woran liegt <i>das</i>?"}], "kreise": [{"id": "rf", "weg": 2, "name": "Ohne Reihenfolge geht auch", "lang": "Ich darf notieren, welche Sorten vorkommen, ohne zu sagen, wo sie liegen."}, {"id": "aus", "weg": 3, "name": "Ein Ausschnitt genügt", "lang": "Ich darf einen Teil des Eises weglassen — im Ereignis und in der Gesamtmenge."}, {"id": "kat", "weg": 4, "name": "Nur die Art genügt", "lang": "Ich darf statt der Sorte nur die Gruppe notieren, zu der sie gehört."}], "sortiment": [{"name": "Erdbeer", "art": "Sorbet", "gruppe": "Klassiker"}, {"name": "Himbeer", "art": "Sorbet", "gruppe": "Neuzugang"}, {"name": "Zitrone", "art": "Sorbet", "gruppe": "Neuzugang"}, {"name": "Vanille", "art": "Milcheis", "gruppe": "Klassiker"}, {"name": "Schoko", "art": "Milcheis", "gruppe": "Klassiker"}, {"name": "Haselnuss", "art": "Milcheis", "gruppe": "Klassiker"}, {"name": "Stracciatella", "art": "Milcheis", "gruppe": "Neuzugang"}, {"name": "Pistazie", "art": "Milcheis", "gruppe": "Neuzugang"}], "kleeblatt": [{"id": "FA1", "gehoert": ["aus"]}, {"id": "FA6", "gehoert": []}, {"id": "FAK1", "gehoert": ["aus", "kat"]}, {"id": "FB6", "gehoert": ["rf"]}, {"id": "FAAU1", "gehoert": ["aus"]}, {"id": "FAK2", "gehoert": ["kat"]}, {"id": "FB2", "gehoert": ["aus"]}, {"id": "FBK2", "gehoert": ["rf"]}, {"id": "FBAU1", "gehoert": ["aus"]}], "transfer": [{"id": "T31", "marke": "Skript 3.1", "kurz": "Skript 3.1", "text": "Ein Würfel wird <b>zweimal</b> geworfen. <i>«Im ersten Wurf eine Drei.»</i> — und <i>«Die Augensumme ist acht.»</i>"}, {"id": "T32", "marke": "Skript 3.2", "kurz": "Skript 3.2", "text": "Zwei Münzen werden <b>gleichzeitig</b> geworfen. <i>«Kopf und Zahl.»</i>"}, {"id": "T33", "marke": "Skript 3.3", "kurz": "Skript 3.3", "text": "Unter 20 Schülern sind zwei Geschwisterpaare. Zwei werden zufällig gewählt. <i>«Ein Geschwisterpaar ist betroffen.»</i>"}, {"id": "T35", "marke": "Skript 3.5", "kurz": "Skript 3.5", "text": "Fünf Personen merken sich je eine Ziffer von 0 bis 9. <i>«Mindestens zwei wählen dieselbe.»</i>"}, {"id": "T36", "marke": "Skript 3.6", "kurz": "Skript 3.6", "text": "Fünf Tische mit je vier Plätzen, zufällig verteilt. <i>«Die <b>ersten beiden</b> Gäste sitzen am gleichen Tisch.»</i>"}, {"id": "TZI", "marke": "Klassenlager", "kurz": "Klassenlager", "text": "12 Kinder (5 Mädchen, 7 Jungen) werden zufällig auf 4 Zimmer zu je 3 verteilt. <i>«In Zimmer 1 sind alle drei Kinder Mädchen.»</i>"}, {"id": "TKA", "marke": "Kartenspiel", "kurz": "Kartenspiel", "text": "Aus 32 Karten (4 Asse, 4 Könige, 24 andere) werden 3 nacheinander gezogen, ohne Zurücklegen. <i>«Die erste Karte ist ein Ass <b>und</b> ein König ist dabei.»</i>"}], "loesung_e1": "<h4>Etappe 1 · die vier Wege</h4><div class=\"zeile\"><b>1 · Alles, mit Reihenfolge</b> — Jede Kugel mit ihrer Sorte, von unten nach oben. Der Vergleichspunkt — diese Rechnung geht immer.</div><div class=\"zeile\"><b>2 · Ohne Reihenfolge</b> — Nur, welche Sorten vorkommen — nicht, wo sie liegen.</div><div class=\"zeile\"><b>3 · Nur ein Ausschnitt</b> — Nur der Teil des Eises, von dem das Ereignis spricht.</div><div class=\"zeile\"><b>4 · Nur die Gruppe</b> — Nicht mehr die Sorte, sondern nur noch, zu welcher Gruppe sie gehört.</div><div class=\"zeile matt\">Auf der Fläche stehen diese Namen bewusst nicht — Weg 1 trägt seinen, die drei Spezialfälle bekommen ein leeres Feld.</div>", "loesung_e2": ""};</script>
